<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>safety.viz portfolio app harness page</title>
  </head>
  <body>
    <!--
      Playwright harness page for the portfolio app (#150). Loads the app bundle
      that `npm run build:app` writes to build/app/ (a build product, not
      committed) and mounts it on the vendored demo extracts under site/data/.
      `?empty` mounts it with no demo study, as the single-file build opens.
    -->
    <div id="app"></div>
    <script src="/build/app/safety.viz-app.js"></script>
    <script>
      const empty = new URLSearchParams(window.location.search).has('empty');
      window.__safetyVizApp = SafetyVizApp.mount(
        '#app',
        empty ? {} : { demo: { base: '/site/data/' } }
      );
    </script>
  </body>
</html>

.sv-root{display:flex;align-items:flex-start;gap:1.25rem;width:100%;position:relative;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1f2933;--sv-rail-width:520px}
.sv-sidebar{position:sticky;top:1rem;flex:0 0 250px;max-height:calc(100vh - 2rem);overflow-y:auto;border:1px solid #d8dee4;border-radius:10px;background:#f6f8fa;padding:.8rem .9rem 1rem}
.sv-sidebar-header{display:flex;align-items:center;justify-content:space-between;gap:.5rem}
.sv-sidebar-title{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#52616f}
.sv-sidebar-toggle{border:1px solid #d8dee4;border-radius:6px;background:#fff;color:#52616f;font:inherit;font-size:.85rem;line-height:1;padding:.25rem .5rem;cursor:pointer}
.sv-sidebar-toggle:hover{color:#1f2933;border-color:#b8c0cc}
.sv-collapsed .sv-sidebar{flex-basis:auto;padding:.5rem}
.sv-collapsed .sv-sidebar-title,.sv-collapsed .sv-controls{display:none}
.sv-control-section{border-top:1px solid #e3e8ee;margin-top:.8rem;padding-top:.65rem}
.sv-section-title{margin:0 0 .5rem;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#52616f}
.sv-controls>.sv-control{margin-top:.75rem}
.sv-control{margin:0 0 .55rem}
.sv-control:last-child{margin-bottom:0}
.sv-control label{display:block;font-size:.78rem;font-weight:600;margin-bottom:.25rem}
.sv-control select,.sv-control input{width:100%;box-sizing:border-box;padding:.35rem .45rem;border:1px solid #b8c0cc;border-radius:6px;background:#fff;font:inherit;font-size:.85rem;color:inherit}
.sv-control input[type=checkbox]{width:auto;margin:0;accent-color:#0b62a4}
.sv-control select:focus-visible,.sv-control input:focus-visible,.sv-sidebar-toggle:focus-visible{outline:2px solid #0b62a4;outline-offset:1px}
.sv-control-row{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.sv-control-row .sv-control{margin:0}
.sv-control-inline{display:flex;align-items:center;gap:.4rem;font-size:.85rem}
.sv-reset{width:100%;margin-top:.75rem;padding:.35rem .45rem;border:1px solid #b8c0cc;border-radius:6px;background:#fff;font:inherit;font-size:.82rem;cursor:pointer}
.sv-reset:hover{border-color:#8f9aa8;background:#f6f8fa}
.sv-reset:focus-visible{outline:2px solid #0b62a4;outline-offset:1px}
.sv-main{flex:1 1 auto;min-width:0}
.sv-notes{display:flex;flex-wrap:wrap;gap:.25rem 1.25rem;font-size:.85rem;color:#52616f;margin:0 0 .6rem}
.sv-warning{color:#9a3412}
.sv-chart-wrap{height:460px;position:relative;border:1px solid #d8dee4;border-radius:10px;padding:1rem;background:#fff}
.sv-footnote{margin:.6rem 0 0;font-size:.85rem;color:#52616f}
.sv-rail{flex:0 0 var(--sv-rail-width);align-self:flex-start;position:sticky;top:1rem;max-height:calc(100vh - 2rem);display:flex;flex-direction:column;overflow:hidden;border:1px solid #d8dee4;border-radius:10px;background:#fbfcfd}
.sv-rail:empty{display:none}
/* The rail takes no width until a participant is selected: the module sets
   [hidden] on the slot while it is idle, and .sv-rail's own display would
   otherwise win over the user-agent rule. */
.sv-rail[hidden]{display:none}
.sv-rail-expanded .sv-rail{position:absolute;inset:0;z-index:6;max-height:none;box-shadow:0 18px 46px rgba(31,41,51,.22)}
.sv-rail-expanded .sv-main,.sv-rail-expanded .sv-sidebar{filter:saturate(.25) opacity(.35)}
.sv-multiples{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1rem;margin-top:1.25rem}
.sv-multiples:empty{display:none}
.sv-multiple{border:1px solid #d8dee4;border-radius:10px;padding:.75rem .85rem;background:#fff}
.sv-multiple h3{font-size:.92rem;margin:0 0 .4rem}
.sv-multiple-canvas{height:200px}
.sv-overview-panel{cursor:pointer;transition:border-color .15s ease,box-shadow .15s ease}
.sv-overview-panel:hover,.sv-overview-panel:focus-visible{border-color:#0b62a4;box-shadow:0 0 0 2px rgba(11,98,164,.18);outline:none}
.sv-listing{margin-top:1.25rem}
.sv-listing table{width:100%;border-collapse:collapse;font-size:.85rem;background:#fff}
.sv-listing th,.sv-listing td{border-bottom:1px solid #e3e8ee;padding:.45rem .55rem;text-align:left;vertical-align:top}
.sv-listing th{border-bottom:2px solid #d8dee4;cursor:pointer;font-size:.75rem;text-transform:uppercase;letter-spacing:.03em;color:#52616f;white-space:nowrap}
.sv-listing tbody tr:hover{background:#f6f8fa}
.sv-listing tbody tr.sv-listing-rowlink{cursor:pointer}
.sv-listing tbody tr.sv-listing-rowlink:focus-visible{outline:2px solid #0b62a4;outline-offset:-2px}
.sv-listing tbody tr.sv-listing-row-selected{background:#e8f0fe}
.sv-listing tbody tr.sv-listing-row-selected:hover{background:#dce8fc}
.sv-listing-actions{display:flex;align-items:center;justify-content:space-between;gap:.75rem;margin:.5rem 0;font-size:.85rem;flex-wrap:wrap}
.sv-listing-tools{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.sv-listing-search{padding:.35rem .45rem;border:1px solid #b8c0cc;border-radius:6px;font:inherit;font-size:.85rem}
.sv-listing-actions button{padding:.3rem .6rem;border:1px solid #d8dee4;border-radius:6px;background:#fff;color:#1f2933;font:inherit;font-size:.8rem;cursor:pointer}
.sv-listing-actions button:hover:not(:disabled){border-color:#b8c0cc;background:#f6f8fa}
.sv-listing-actions button:disabled{opacity:.45;cursor:default}
.sv-annotation,.sv-main-annotation{font-size:.85rem;background:rgba(255,255,255,.92);border:1px solid #d8dee4;border-radius:6px;padding:.25rem .4rem}
.sv-main-annotation{position:absolute;right:1.25rem;top:1.25rem;z-index:2}
.sv-main-annotation:empty{display:none}
.sv-info{text-decoration:none}
.sv-hidden{display:none!important}
.sv-view-list{display:flex;flex-direction:column;gap:.35rem}
.sv-view-option{display:block;width:100%;text-align:left;padding:.45rem .55rem;border:1px solid #d8dee4;border-radius:8px;background:#fff;font:inherit;font-size:.85rem;line-height:1.3;color:#1f2933;cursor:pointer}
.sv-view-option:hover{border-color:#b8c0cc;background:#f6f8fa}
.sv-view-option.is-active{border-color:#0b62a4;background:#eaf2fb;color:#0b3d63;font-weight:600;box-shadow:inset 0 0 0 1px #0b62a4}
.sv-view-option:focus-visible{outline:2px solid #0b62a4;outline-offset:1px}
.sv-multiselect{border:1px solid #b8c0cc;border-radius:6px;background:#fff}
.sv-multiselect>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:.4rem;padding:.35rem .45rem;font-size:.85rem;cursor:pointer;border-radius:6px}
.sv-multiselect>summary::-webkit-details-marker{display:none}
.sv-multiselect>summary::after{content:"\u25BE";font-size:.7rem;color:#52616f}
.sv-multiselect[open]>summary::after{content:"\u25B4"}
.sv-multiselect>summary:focus-visible{outline:2px solid #0b62a4;outline-offset:1px}
.sv-ms-list{max-height:10rem;overflow-y:auto;border-top:1px solid #e3e8ee;padding:.3rem .45rem}
.sv-ms-option{display:flex;align-items:center;gap:.4rem;font-size:.8rem;font-weight:400;margin:.15rem 0;cursor:pointer}
.sv-ms-option input[type=checkbox]{width:auto;margin:0;accent-color:#0b62a4;flex:0 0 auto}
.sv-ms-option.sv-ms-all{font-weight:600;border-bottom:1px solid #e3e8ee;padding-bottom:.25rem;margin-bottom:.25rem}
.sv-prototype,.sv-experimental{display:flex;align-items:baseline;gap:.5rem;margin:0 0 .6rem;padding:.4rem .6rem;border:1px solid #e6c98a;border-left:4px solid #d99a2b;border-radius:6px;background:#fdf6e6;color:#6b4e12;font-size:.8rem;line-height:1.35}
.sv-prototype-tag{flex:0 0 auto;text-transform:uppercase;letter-spacing:.05em;font-weight:700;font-size:.68rem;padding:.08rem .4rem;border-radius:999px;background:#d99a2b;color:#fff}
.sv-prototype-text{flex:1 1 auto}
@media (max-width:900px){
.sv-root{flex-direction:column;align-items:stretch}
.sv-sidebar{position:static;flex:1 1 auto;width:100%;box-sizing:border-box;max-height:none}
.sv-rail{position:static;flex:1 1 auto;width:100%;box-sizing:border-box;max-height:none}
.sv-rail-expanded .sv-rail{position:static}
.sv-rail-expanded .sv-main,.sv-rail-expanded .sv-sidebar{filter:none}

.sv-profile-root{margin-top:.5rem}

/* --- the rail (obot.roadmap#75, decisions D1/D2/D3/D8) --------------------- */
.sv-profile-rail{display:flex;flex-direction:column;min-height:0;height:100%}
.sv-profile-rail-head{display:flex;align-items:flex-start;justify-content:space-between;gap:.6rem;padding:.55rem .7rem;border-bottom:1px solid #e3e8ee;background:#f2f6f8;flex:0 0 auto}
.sv-profile-rail-title{margin:0;font-size:.95rem;font-weight:700;font-variant-numeric:tabular-nums}
.sv-profile-rail-sub{margin:.1rem 0 0;font-size:.75rem;color:#52616f}
.sv-profile-rail-actions{display:flex;gap:.35rem;flex:0 0 auto}
.sv-profile-rail-btn{border:1px solid #d8dee4;background:#fff;color:#1f2933;border-radius:6px;font:inherit;font-size:.75rem;padding:.3rem .5rem;cursor:pointer;white-space:nowrap}
.sv-profile-rail-btn:hover{border-color:#0b62a4;color:#0b3d63}
.sv-profile-rail-btn:focus-visible{outline:2px solid #0b62a4;outline-offset:1px}
.sv-profile-rail-stepper{flex:0 0 auto;background:#fff;border-bottom:1px solid #e3e8ee}
.sv-profile-rail-stepper:empty{display:none}
.sv-profile-rail-body{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:auto;padding:.7rem}
.sv-profile-rail.is-empty .sv-profile-rail-body::before{content:"Click a participant in the chart to read their profile here.";display:block;padding:2rem .5rem;text-align:center;color:#7b8b96;font-size:.88rem}
/* Expanded, the block gets room for a proper control column beside it \u2014 which
   is to say the expanded profile is the standalone renderer (decision D3). */
.sv-rail-expanded .sv-profile-rail-body{padding:1rem}
.sv-rail-expanded .sv-profile-controls{flex-direction:column;align-items:stretch;float:left;width:210px;margin:0 1.25rem .75rem 0;padding-right:1rem;border-right:1px solid #e3e8ee}
.sv-rail-expanded .sv-profile-spaghetti-card{height:360px}

/* --- the cohort list (decision D8) ---------------------------------------- */
.sv-profile-step-toggle{margin-left:auto;border:1px solid #d8dee4;background:#fff;color:#52616f;border-radius:6px;font:inherit;font-size:.72rem;padding:.2rem .45rem;cursor:pointer}
.sv-profile-step-toggle:hover{border-color:#0b62a4;color:#0b3d63}
.sv-profile-step-toggle:focus-visible{outline:2px solid #0b62a4;outline-offset:1px}
.sv-profile-cohort{max-height:9rem;overflow-y:auto;border-top:1px solid #e3e8ee;background:#fbfcfd}
.sv-profile-cohort-list{list-style:none;margin:0;padding:.25rem;counter-reset:cohort}
.sv-profile-cohort-list li{counter-increment:cohort}
.sv-profile-cohort-item{display:block;width:100%;text-align:left;border:0;background:none;font:inherit;font-size:.8rem;padding:.2rem .4rem;border-radius:4px;cursor:pointer;color:#1f2933}
.sv-profile-cohort-item::before{content:counter(cohort) ". ";color:#7b8b96;font-variant-numeric:tabular-nums}
.sv-profile-cohort-item:hover{background:#eef3f6}
.sv-profile-cohort-item.is-current{background:#eaf2fb;font-weight:600}
.sv-profile-cohort-item:focus-visible{outline:2px solid #0b62a4;outline-offset:-2px}

/* --- the adverse-event tracks (decisions D5/D6/D7) ------------------------ */
.sv-profile-ae{margin:.9rem 0 1rem;padding:.75rem 0 .2rem;border-top:1px solid #e3e8ee;border-bottom:1px solid #e3e8ee}
.sv-profile-ae-title{margin:0 0 .55rem;font-size:.95rem;font-weight:700}
.sv-profile-ae-tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem;margin-bottom:.6rem}
.sv-profile-ae-tile{border:1px solid #e3e8ee;border-radius:7px;padding:.35rem .5rem;background:#fff}
.sv-profile-ae-tile-value{display:flex;align-items:center;gap:.3rem;font-size:1rem;font-weight:700;font-variant-numeric:tabular-nums}
.sv-profile-ae-tile-label{margin-top:.1rem;font-size:.66rem;text-transform:uppercase;letter-spacing:.05em;color:#7b8b96}
.sv-profile-ae-dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;display:inline-block}
.sv-profile-ae-mix{display:flex;gap:2px;height:10px}
.sv-profile-ae-mix-seg{border-radius:2px;min-width:4px}
.sv-profile-ae-legend{display:flex;flex-wrap:wrap;gap:.2rem .8rem;margin-top:.3rem;font-size:.74rem;color:#52616f}
.sv-profile-ae-legend-item{display:inline-flex;align-items:center;gap:.3rem}
.sv-profile-ae-track-label{margin:.6rem 0 .35rem;font-size:.66rem;text-transform:uppercase;letter-spacing:.08em;color:#7b8b96}
.sv-profile-ae-timeline{box-sizing:border-box;border:1px solid transparent;padding:0 .75rem}
.sv-profile-ae-plotarea{position:relative;box-sizing:border-box}
.sv-profile-ae-plot{position:relative}
.sv-profile-ae-row{position:relative;height:27px}
.sv-profile-ae-term{position:absolute;top:0;line-height:14px;font-size:.7rem;color:#52616f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sv-profile-ae-term.is-flipped{text-align:right}
.sv-profile-ae-bar{position:absolute;top:16px;height:9px;border-radius:3px;min-width:4px}
.sv-profile-ae-bar.is-open-ended{border-radius:3px 0 0 3px;-webkit-mask-image:linear-gradient(to right,#000 0,#000 60%,rgba(0,0,0,.25) 100%);mask-image:linear-gradient(to right,#000 0,#000 60%,rgba(0,0,0,.25) 100%)}
.sv-profile-ae-bar.is-serious{box-shadow:0 0 0 2px #fff,0 0 0 3.5px #d03b3b}
.sv-profile-ae-axis{position:relative;height:18px;margin-top:2px;border-top:1px solid #e3e8ee}
.sv-profile-ae-tick{position:absolute;top:2px;transform:translateX(-50%);font-size:.65rem;color:#7b8b96;font-variant-numeric:tabular-nums}
.sv-profile-ae-more,.sv-profile-ae-unplaceable{margin:.4rem 0 0;font-size:.72rem;color:#7b8b96}
.sv-profile-ae-empty{margin:.3rem 0 .8rem;font-size:.82rem;color:#7b8b96}
.sv-profile-ae-soc-wrap{margin-top:.7rem}
.sv-profile-ae-soc{list-style:none;margin:0;padding:0}
.sv-profile-ae-soc li{display:flex;justify-content:space-between;gap:.6rem;font-size:.76rem;padding:.16rem 0;border-bottom:1px dotted #e3e8ee}
.sv-profile-ae-soc-name{color:#52616f;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sv-profile-ae-soc-count{font-variant-numeric:tabular-nums;font-weight:600}
.sv-profile-live{position:absolute;width:1px;height:1px;margin:-1px;padding:0;border:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sv-profile-table-footnote{margin:.5rem 0 0;font-size:.72rem;color:#52616f}
.sv-profile-spaghetti-canvas:focus-visible{outline:2px solid #0b62a4;outline-offset:1px}
.sv-profile-header{border-top:2px solid #111827;border-bottom:2px solid #111827;padding:.4rem .2rem;margin:0 0 .75rem}
.sv-profile-titlerow{display:flex;align-items:baseline;flex-wrap:wrap;gap:.75rem}
.sv-profile-id{font-size:1rem;font-weight:700;margin:0}
.sv-profile-link{font-size:.8rem;text-decoration:none;color:#0b62a4}
.sv-profile-link:hover{text-decoration:underline}
.sv-profile-clear{margin-left:auto;padding:.25rem .6rem;border:1px solid #b8c0cc;border-radius:6px;background:#fff;color:#1f2933;font:inherit;font-size:.8rem;cursor:pointer}
.sv-profile-clear:hover{border-color:#8a94a6;background:#f6f8fa}
.sv-profile-clear:focus-visible,.sv-profile-palt .sv-profile-detail-value:focus-visible{outline:2px solid #0b62a4;outline-offset:1px}
.sv-profile-details{list-style:none;display:flex;flex-wrap:wrap;gap:.25rem 1.5rem;padding:0;margin:.5rem 0 0}
.sv-profile-details li{text-align:center}
.sv-profile-detail-label{font-size:.72rem;text-transform:uppercase;letter-spacing:.03em;color:#52616f}
.sv-profile-detail-value{font-size:.9rem;font-variant-numeric:tabular-nums}
.sv-profile-palt .sv-profile-detail-value{border-bottom:1px dotted #999;cursor:pointer}
.sv-profile-footnote{margin:.4rem 0 0;font-size:.75rem;color:#52616f;min-height:1rem}
.sv-profile-controls{display:flex;flex-wrap:wrap;align-items:flex-end;gap:.75rem 1rem;margin:0 0 .75rem}
.sv-profile-controls .sv-profile-field{display:flex;flex-direction:column;gap:.2rem;font-size:.78rem}
.sv-profile-controls label{font-weight:600;color:#52616f}
.sv-profile-controls select{padding:.3rem .4rem;border:1px solid #b8c0cc;border-radius:6px;background:#fff;font:inherit;font-size:.82rem}
.sv-profile-controls select:focus-visible,.sv-profile-extras input:focus-visible{outline:2px solid #0b62a4;outline-offset:1px}
.sv-profile-spaghetti-card{height:300px;position:relative;border:1px solid #d8dee4;border-radius:10px;padding:.75rem;background:#fff}
.sv-profile-spaghetti-footnote{margin:.5rem 0 0;font-size:.72rem;color:#52616f}
.sv-profile-extras{display:inline-flex;align-items:center;gap:.4rem;font-size:.8rem;margin:.75rem 0 .25rem}
.sv-profile-extras input{accent-color:#0b62a4}
.sv-profile-measure-wrap{margin:.75rem 0 0}
.sv-profile-measure-table{width:100%;border-collapse:collapse;font-size:.82rem}
.sv-profile-measure-table th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.03em;color:#52616f;padding:.3rem .5rem;border-bottom:2px solid #111827}
.sv-profile-measure-table td{padding:.3rem .5rem;font-variant-numeric:tabular-nums}
.sv-profile-measure-row td{border-bottom:.5px solid #111827}
.sv-profile-inset-row td{border-bottom:.5px solid #111827;background:none}
.sv-profile-spark{white-space:nowrap}
.sv-profile-spark svg{vertical-align:middle}
.sv-profile-spark-toggle{border:none;background:none;color:#999;cursor:pointer;font:inherit;font-size:.8rem;padding:.1rem .3rem;vertical-align:middle}
.sv-profile-spark-toggle:hover{color:#1f2933}
.sv-profile-spark-toggle:focus-visible{outline:2px solid #0b62a4;outline-offset:1px}
.sv-profile-inset-card{height:200px;position:relative;padding:.5rem 0}
.sv-profile-listing{margin:1rem 0 0}
.sv-profile-listing-title{margin:0 0 .4rem;font-size:.85rem}
.sv-profile-stepper{display:flex;align-items:center;gap:.6rem;margin:0 0 .5rem;font-size:.85rem}
.sv-profile-step{padding:.2rem .55rem;border:1px solid #b8c0cc;border-radius:6px;background:#fff;color:#1f2933;font:inherit;font-size:.8rem;cursor:pointer}
.sv-profile-step:hover:not(:disabled){border-color:#8a94a6;background:#f6f8fa}
.sv-profile-step:disabled{opacity:.45;cursor:default}
.sv-profile-step:focus-visible,.sv-profile-stepper:focus-visible{outline:2px solid #0b62a4;outline-offset:1px}
.sv-profile-step-count{font-variant-numeric:tabular-nums}

DY/EXSTDY and AENDY/EXENDY by default) and optionally the start date (ex_stdtc_col). The exposure lane draws one bar segment per record; consecutive records with different doses derive the dose-change events (PJE-DERIV-001, PJE-LANE-006). A row with both treatment and dose blank is dropped with a named reason; a row with no usable start day is kept but not drawn."},ae:{type:"array",items:{$ref:"#/$defs/aeRow"},requiredSettings:["id_col","ae_stdy_col"],description:"Adverse-event records (an ADAE or AE projection), one row per event: the participant id, the verbatim and preferred terms (ae_term_col, ae_decod_col), the body system (ae_soc_col), onset and resolution study days (ae_stdy_col, ae_endy_col \u2014 ASTDY/AESTDY and AENDY/AEENDY by default), severity, seriousness and relatedness (ae_sev_col, ae_ser_col, ae_rel_col), the outcome (ae_out_col, which decides whether a blank end day means ongoing or simply not recorded, D16) and optionally the onset date (ae_stdtc_col). Anchoring an event opens the \xB1N-day context window (PJE-ANCH-001). A row with both terms blank is dropped with a named reason; an end day before the start day is kept as a single-day mark and counted (PJE-DATA-008)."},lb:{type:"array",items:{$ref:"#/$defs/lbRow"},requiredSettings:["id_col","lb_test_col","lb_value_col","lb_day_col"],description:"Lab records (an ADLB or LB projection), one row per result: the participant id, the test name and code (lb_test_col, lb_testcd_col \u2014 lb_tests matches either), the numeric result and unit (lb_value_col, lb_unit_col), the reference range (lb_lo_col, lb_hi_col), the normal-range indicator (lb_nrind_col), the study day (lb_day_col \u2014 LBDY/ADY by default), the analysis-baseline flag (lb_baseline_flag_col, consulted first when resolving a test's baseline, D17) and optionally the collection date (lb_dtc_col). Each configured test draws as a small multiple with its reference band (PJE-LANE-005); a point is abnormal by flag when the indicator is present and not normal, or by change when it is at least lb_change_factor times, or at most 1/lb_change_factor of, the baseline (PJE-CTX-002). A row with a blank test name or a non-numeric result is dropped with a named reason."},cm:{type:"array",items:{$ref:"#/$defs/cmRow"},requiredSettings:["id_col","cm_trt_col"],description:"Concomitant-medication records (an ADCM or CM projection), one row per medication course: the participant id, the medication name (cm_trt_col), its class (cm_class_col; the uncoded value is kept as its own selectable bucket, PJE-FILT-003), optional dose and route (cm_dose_col, cm_route_col), start and end study days (cm_stdy_col, cm_endy_col \u2014 ASTDY/CMSTDY and AENDY/CMENDY by default), optionally an ongoing indicator (cm_out_col; none by default, so a blank end day is 'end not recorded' rather than asserted ongoing) and the start date (cm_stdtc_col). Con-meds active at an anchor are those started on or before it and not ended before it; one with no usable start day is never asserted active and is counted as not evaluated (PJE-CTX-001). A row with a blank name is dropped with a named reason."},mh:{type:"array",items:{$ref:"#/$defs/mhRow"},requiredSettings:["id_col"],description:"Medical-history records (an ADMH or MH projection), one row per condition: the participant id, the verbatim and decoded terms (mh_term_col, mh_decod_col \u2014 the decode is preferred as the label because verbatim terms are often scrubbed), the category (mh_cat_col), the collection study day (mh_day_col, the screening visit, where the mark is drawn by default, D18), the onset study day, date and relative-timing text (mh_onset_stdy_col, mh_onset_dtc_col, mh_strtpt_col \u2014 named in the tooltip) and the end relative-timing text (mh_enrtpt_col; ONGOING adds 'still present'). Set mh_day_source to 'onset' to place marks at onset instead. A row with both terms blank is dropped with a named reason."},ds:{type:"array",items:{$ref:"#/$defs/dsRow"},requiredSettings:["id_col","ds_decod_col"],description:"Disposition records (a DS projection), one row per disposition event or milestone: the participant id, the decoded and verbatim terms (ds_decod_col, ds_term_col), the category (ds_cat_col), the study day (ds_stdy_col) and optionally the date (ds_dtc_col). Every row draws a mark in the disposition lane; only rows whose category is in ds_reference_cats (DISPOSITION EVENT by default) draw the full-height dashed rule across every lane (D19). A row with a blank decode is dropped with a named reason."},settings:{type:"object",description:"Column mappings and rendering options; merged onto the module's DEFAULT_SETTINGS, so only overrides need to be supplied. Column settings are flat, snake_case and domain-prefixed; the plan's camelCase spellings (contextWindowDays, onAnchorEvent, sourceUrlTemplate, lane-level severityCol/seriousCol/tests, filters[].col, time.day_col/date_col) are accepted as aliases and normalized with a console warning each (PJE-CFG-002).",properties:{id_col:{type:"string",default:"USUBJID",description:"Participant identifier column, present in every domain; the subject picker lists its distinct values across all domains and the participantsSelected event carries it (PJE-SUBJ-001, PJE-EVT-002)."},domain_col:{type:"string",default:"DOMAIN",description:"For the merged-array input form, the column whose value names each row's domain (AE, LB, EX, CM, MH, DS, or the ADaM spellings ADAE \u2026, case-insensitively); rows with any other value are dropped with a named reason (PJE-DATA-002)."},subject:{type:["string","null"],default:null,description:"The subject to open on; null opens on the first subject in sorted order (PJE-SUBJ-001)."},time:{type:"object",description:"Time-axis configuration: mode ('day' or 'date', the opening display), ref_date_col ('TRTSDT', the column holding the date of study day 1, read from any row of any domain) and allow_date_mode (true; when false the calendar-date control is not offered). The plan's day_col / date_col keys are accepted as generic --DY / --DTC patterns expanded per domain (PJE-TIME-001, PJE-TIME-002).",properties:{mode:{type:"string",enum:["day","date"],default:"day",description:"The opening display mode: study day, or calendar date (only when allow_date_mode is true and a reference date resolves for the subject). The scale stays linear in days in both modes; date mode relabels ticks, tooltips and panel text (D7)."},ref_date_col:{type:"string",default:"TRTSDT",description:"Column holding the date of study day 1 (first dose), read from any row of any domain and preferred over deriving the reference from a recorded --DTC date plus its study day (D30)."},allow_date_mode:{type:"boolean",default:!0,description:"Whether the calendar-date display is offered at all; false forces mode to 'day'."}}},context_window_days:{type:"number",default:30,description:"Half-width of the anchor context window in elapsed days, inclusive on both sides; coerced to a non-negative integer, and 0 means the anchor day only (PJE-CFG-004, PJE-ANCH-002)."},ex_trt_col:{type:"string",default:"EXTRT",description:"Exposure treatment name column; the exposure lane draws one row per distinct value and each record's label and category come from it."},ex_dose_col:{type:"string",default:"EXDOSE",description:"Exposure dose column; consecutive records with different numeric doses derive the dose-change events (PJE-DERIV-001). A record with both treatment and dose blank is dropped."},ex_dosu_col:{type:"string",default:"EXDOSU",description:"Exposure dose unit column, appended to the dose in tooltips and dose-change labels."},ex_stdy_col:{type:["string","array"],default:["ASTDY","EXSTDY"],description:"Exposure start study day, as a column name or a fallback chain resolved per row; required in exposure data. A record with no usable start day is kept but not drawn (PJE-LANE-008)."},ex_endy_col:{type:["string","array"],default:["AENDY","EXENDY"],description:"Exposure end study day, as a column name or a fallback chain; a blank end is 'end not recorded' (exposure has no outcome column)."},ex_stdtc_col:{type:"string",default:"EXSTDTC",description:"Exposure start date column (--DTC), shown as recorded; a full date labels the record in date mode and a partial one never positions it (PJE-TIME-003)."},ae_term_col:{type:"string",default:"AETERM",description:"Adverse-event verbatim term column; the tooltip's secondary line when it differs from the decoded term, and the label when the decode is blank. A record with both blank is dropped."},ae_decod_col:{type:"string",default:"AEDECOD",description:"Adverse-event preferred term column: the mark label, and the key the 'prior events with the same preferred term' context list matches on (PJE-CTX-004)."},ae_soc_col:{type:"string",default:"AEBODSYS",description:"Adverse-event body-system column, shown as the record's category."},ae_stdy_col:{type:["string","array"],default:["ASTDY","AESTDY"],description:"Adverse-event onset study day, as a column name or a fallback chain; required in adverse-event data."},ae_endy_col:{type:["string","array"],default:["AENDY","AEENDY"],description:"Adverse-event resolution study day, as a column name or a fallback chain. A blank end is 'ongoing' only when ae_out_col says so, otherwise 'end not recorded'; an end before the start is kept as a single-day mark and counted (PJE-DATA-008)."},ae_sev_col:{type:"string",default:"AESEV",description:"Adverse-event severity column, ranked by ae_severity_values; drawn as bar height and border weight at one opaque fill, and a blank value draws a hatched mark named 'severity not recorded' (PJE-ACC-002)."},ae_ser_col:{type:"string",default:"AESER",description:"Adverse-event seriousness column, compared with ae_serious_value; serious events get a filled start dot, an escalation ring and an SAE tag."},ae_rel_col:{type:"string",default:"AEREL",description:"Adverse-event relatedness column, shown in the tooltip as recorded."},ae_stdtc_col:{type:"string",default:"AESTDTC",description:"Adverse-event onset date column (--DTC), shown as recorded (PJE-TIME-003, PJE-TIME-004)."},ae_severity_values:{type:"array",default:["MILD","MODERATE","SEVERE"],description:"Severity levels in ascending rank; a value outside the list keeps rank 0 and draws at the moderate height. An empty list falls back to the default."},ae_serious_value:{type:"string",default:"Y",description:"The ae_ser_col value (case-insensitive) that marks a serious event (PJE-FILT-001)."},ae_out_col:{type:["string","null"],default:"AEOUT",description:"Adverse-event outcome column, read only when the end day is blank: the event is 'ongoing' when this cell is one of ae_ongoing_values, and 'end not recorded' otherwise (D16)."},ae_ongoing_values:{type:"array",default:["NOT RECOVERED/NOT RESOLVED","RECOVERING/RESOLVING","ONGOING","N"],description:"Outcome values (upper-cased, trimmed) that assert an event is still running when its end day is blank."},lb_test_col:{type:"string",default:"LBTEST",description:"Lab test name column; required in lab data. A record with a blank name is dropped; lb_tests matches this column or lb_testcd_col, case-insensitively."},lb_testcd_col:{type:"string",default:"LBTESTCD",description:"Lab test code column; lb_tests entries match either the name or the code, so 'Alanine Aminotransferase' and 'ALT' select the same series."},lb_value_col:{type:"string",default:"LBSTRESN",description:"Lab numeric result column; required in lab data. A non-numeric result is dropped with a named reason."},lb_lo_col:{type:"string",default:"LBSTNRLO",description:"Lab lower limit of normal column; with lb_hi_col draws the reference band and the \xD7 LLN ratio (PJE-LANE-005)."},lb_hi_col:{type:"string",default:"LBSTNRHI",description:"Lab upper limit of normal column; with lb_lo_col draws the reference band and the \xD7 ULN ratio."},lb_day_col:{type:["string","array"],default:["LBDY","ADY"],description:"Lab study day, as a column name or a fallback chain; required in lab data."},lb_nrind_col:{type:"string",default:"LBNRIND",description:"Lab normal-range indicator column: a present value other than lb_normal_value marks the point abnormal by flag (PJE-CTX-002); HIGH/LOW pick the glyph and HH/LL add the escalation ring."},lb_unit_col:{type:"string",default:"LBSTRESU",description:"Lab result unit column, appended to values in labels and the panel."},lb_dtc_col:{type:"string",default:"LBDTC",description:"Lab collection date column (--DTC), shown as recorded."},lb_tests:{type:"array",default:["Alanine Aminotransferase","Aspartate Aminotransferase","Bilirubin","Alkaline Phosphatase"],description:"The lab tests drawn as small multiples, in this order, matched case-insensitively against the test name or code; an empty list means every test present. The plan's labTests and lane-level tests are aliases."},lb_normal_value:{type:"string",default:"NORMAL",description:"The lb_nrind_col value meaning within range; any other non-blank value is abnormal by flag, and a blank value is not abnormal."},lb_baseline_flag_col:{type:["string","null"],default:"ABLFL",description:"Analysis-baseline flag column, consulted first when resolving a test's baseline (D17); null skips the flag rule."},lb_baseline_flag_value:{type:"string",default:"Y",description:"The lb_baseline_flag_col value marking the baseline record."},lb_baseline_day:{type:"number",default:1,description:"Fallback baseline rule: the last value on or before this study day, used only when no flagged record exists (PJE-DERIV-002)."},lb_change_factor:{type:"number",default:2,description:"Symmetric change rule: a value at least this many times, or at most 1/this of, the baseline is abnormal by change (D28). Must exceed 1."},cm_trt_col:{type:"string",default:"CMTRT",description:"Con-med name column; required in con-med data. A record with a blank name is dropped with a named reason."},cm_class_col:{type:"string",default:"CMCLAS",description:"Con-med class column (ATC class), the record's category and the multis /* --- the lane stack inside the shell's chart card (design \xA76.1) ------------ */
.sv-root.safety-patient-journey{--sv-rail-width:360px}
.safety-patient-journey .sv-chart-wrap{height:auto;padding:.75rem .75rem .5rem;background:var(--pje-surface);color:var(--pje-ink-primary)}
/* The shell pins its annotation to the card's top-right corner, which here is
   the first lane group \u2014 the pill covered the group header and the end of the
   exposure bar. The lanes fill the card, so the hint sits in flow beneath the
   axis strip instead, where it also links to the panel on a stacked layout. */
.safety-patient-journey .sv-main-annotation{position:static;display:flex;flex-wrap:wrap;align-items:center;gap:.35rem .6rem;margin:.5rem 0 0;padding:.3rem .5rem;font-size:.78rem;color:var(--pje-ink-secondary)}
.safety-patient-journey .sv-main-annotation:empty{display:none}
/* The notice above the lane stack (PJE-ANCH-006): the one line a first-time
   reviewer needs \u2014 that the marks are clickable and what clicking shows. */
.sv-pje-cue{display:flex;flex-wrap:wrap;align-items:baseline;gap:.2rem .5rem;margin:0 0 .6rem;padding:.55rem .75rem;border:1px solid var(--pje-border);border-left:4px solid var(--pje-focus-ring);border-radius:6px;background:var(--pje-panel);font-size:.84rem;line-height:1.4;color:var(--pje-ink-primary)}
.sv-pje-cue[hidden]{display:none}
.sv-pje-cue strong{font-weight:700}
.sv-pje-annotation-link{border:0;background:none;padding:0;font:inherit;color:var(--pje-focus-ring);text-decoration:underline;cursor:pointer}
.sv-pje-annotation-link:focus-visible{outline:2px solid var(--pje-focus-ring);outline-offset:1px}
.sv-pje-lanes{position:relative;overflow-y:auto;overflow-x:hidden}
.sv-pje-note{margin:.5rem 0;font-size:.85rem;color:var(--pje-ink-secondary)}
.sv-pje-group{margin:0 0 .3rem}
.sv-pje-group-toggle{display:flex;align-items:center;gap:.4rem;width:100%;border:0;border-bottom:1px solid var(--pje-border);background:transparent;color:var(--pje-ink-secondary);font:inherit;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:.3rem 0 .25rem;margin:0 0 .25rem;cursor:pointer;text-align:left}
.sv-pje-group-toggle::before{content:"\\25BE";font-size:.7rem}
.sv-pje-group-toggle[aria-expanded=false]::before{content:"\\25B8"}
.sv-pje-group-toggle:focus-visible{outline:2px solid var(--pje-focus-ring);outline-offset:1px}
.sv-pje-group-body[hidden]{display:none}
.sv-pje-lane{position:relative;box-sizing:border-box;margin:0 0 2px}
.sv-pje-lane-canvas{position:absolute;inset:0}
.sv-pje-canvas{display:block;width:100%;height:100%}
.sv-pje-lane-label{position:absolute;left:0;top:0;bottom:0;width:${t}px;box-sizing:border-box;padding:0 .5rem 0 0;display:flex;flex-direction:column;justify-content:center;font-size:.74rem;line-height:1.2;color:var(--pje-ink-secondary);pointer-events:none;overflow:hidden;z-index:1}
.sv-pje-lane-label strong{color:var(--pje-ink-primary);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sv-pje-lane-label small{font-size:.68rem;line-height:1.15;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.sv-pje-lane-empty{position:absolute;left:${t}px;right:${e}px;top:0;bottom:0;display:flex;align-items:center;font-size:.78rem;color:var(--pje-ink-secondary)}
.sv-pje-lane-foot{margin:.05rem 0 .3rem ${t}px;font-size:.72rem;color:var(--pje-ink-secondary)}

/* --- the keyboard overlay: real buttons over the canvas (design \xA78) -------- */
.sv-pje-marks{position:absolute;inset:0;pointer-events:none;z-index:2}
.sv-pje-mark{position:absolute;box-sizing:border-box;margin:0;padding:0;border:0;background:transparent;pointer-events:auto;cursor:pointer;border-radius:3px}
.sv-pje-mark:focus{outline:none}
.sv-pje-mark:focus-visible{outline:2px solid var(--pje-focus-ring);outline-offset:2px;box-shadow:0 0 0 2px var(--pje-focus-separator)}

/* --- the one shared axis strip, pinned below the stack (design \xA76.2) ------- */
.sv-pje-axis{position:relative;margin:.35rem 0 0;padding:0 ${e}px 0 ${t}px;height:2.3rem}
.sv-pje-axis-title{position:absolute;left:0;top:0;width:${t}px;box-sizing:border-box;padding:.35rem .5rem 0 0;font-size:.7rem;font-weight:600;color:var(--pje-ink-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sv-pje-axis-track{position:relative;height:100%;border-top:1px solid var(--pje-border)}
.sv-pje-axis-tick{position:absolute;top:0;transform:translateX(-50%);padding-top:.35rem;font-size:.68rem;color:var(--pje-ink-secondary);font-variant-numeric:tabular-nums;white-space:nowrap}
.sv-pje-axis-tick::before{content:"";position:absolute;left:50%;top:-1px;width:1px;height:4px;background:var(--pje-ink-secondary)}
.sv-pje-axis-tick.is-anchor{font-weight:700;color:var(--pje-ink-primary)}
.sv-pje-axis-tick.is-anchor::before{width:2px;background:var(--pje-rule-anchor)}

/* --- the tooltip and the footnote line (design \xA76.5, \xA76.7) ----------------- */
.sv-pje-tooltip{position:absolute;z-index:5;max-width:320px;padding:.4rem .55rem;border-radius:6px;background:var(--pje-ink-primary);color:var(--pje-surface);font-size:.76rem;line-height:1.35;pointer-events:none;white-space:pre-line;box-shadow:0 4px 14px rgba(31,41,51,.18)}
.sv-pje-tooltip[hidden]{display:none}
.sv-pje-footnote-text{margin-right:.5rem}
.sv-pje-open-source{border:1px solid var(--pje-border);background:var(--pje-surface);color:var(--pje-ink-primary);border-radius:6px;font:inherit;font-size:.75rem;padding:.2rem .5rem;cursor:pointer}
.sv-pje-open-source:hover{border-color:var(--pje-focus-ring)}
.sv-pje-open-source:focus-visible{outline:2px solid var(--pje-focus-ring);outline-offset:1px}

/* --- sidebar additions (design \xA77) ---------------------------------------- */
.sv-pje-subject-list{width:100%;font:inherit;font-size:.82rem;margin-top:.35rem}
.sv-pje-subject-count{margin:.25rem 0 0;font-size:.72rem;color:var(--pje-ink-secondary)}
.sv-pje-sidebar-note{margin:.35rem 0 0;font-size:.72rem;color:var(--pje-ink-secondary)}
.sv-pje-lane-toggle{display:flex;align-items:center;gap:.4rem;font-size:.8rem;font-weight:400;margin:.15rem 0;cursor:pointer}
.sv-pje-lane-toggle input{width:auto;margin:0;accent-color:var(--pje-focus-ring)}
.sv-pje-lane-toggle.is-disabled{color:var(--pje-ink-secondary);cursor:default}

/* --- the anchor context panel in the shell rail (design \xA76.6) -------------- */
.sv-pje-panel{display:flex;flex-direction:column;min-height:0;height:100%;font-size:.82rem;color:var(--pje-ink-primary)}
.sv-pje-panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:.6rem;padding:.55rem .7rem;border-bottom:1px solid var(--pje-border);background:var(--pje-panel);flex:0 0 auto}
.sv-pje-panel-title{margin:0;font-family:inherit;font-size:.95rem;font-weight:700}
.sv-pje-panel-title:focus{outline:none}
.sv-pje-panel-sub{margin:.1rem 0 0;font-size:.75rem;color:var(--pje-ink-secondary)}
.sv-pje-panel-actions{display:flex;gap:.35rem;flex:0 0 auto}
.sv-pje-btn{border:1px solid var(--pje-border);background:var(--pje-surface);color:var(--pje-ink-primary);border-radius:6px;font:inherit;font-size:.75rem;padding:.3rem .5rem;cursor:pointer;white-space:nowrap}
.sv-pje-btn:hover:not(:disabled){border-color:var(--pje-focus-ring)}
.sv-pje-btn:focus-visible{outline:2px solid var(--pje-focus-ring);outline-offset:1px}
.sv-pje-btn:disabled{opacity:.5;cursor:default}
.sv-pje-panel-body{flex:1 1 auto;min-height:0;overflow-y:auto;padding:.6rem .7rem}
.sv-pje-section{margin:0 0 .8rem}
.sv-pje-section h3{margin:0 0 .3rem;font-family:inherit;font-size:.82rem;font-weight:700}
.sv-pje-section h4{margin:.45rem 0 .2rem;font-family:inherit;font-size:.74rem;font-weight:600;color:var(--pje-ink-secondary)}
.sv-pje-section-note{margin:0 0 .3rem;font-size:.72rem;color:var(--pje-ink-secondary)}
.sv-pje-honesty{margin:.15rem 0 .3rem;font-size:.74rem;color:var(--pje-warning)}
.sv-pje-empty{margin:.1rem 0;font-size:.76rem;color:var(--pje-ink-secondary);font-style:italic}
.sv-pje-items{list-style:none;margin:0;padding:0}
.sv-pje-item{display:block;width:100%;text-align:left;border:1px solid transparent;background:none;font:inherit;font-size:.78rem;line-height:1.3;padding:.25rem .4rem;border-radius:4px;cursor:pointer;color:var(--pje-ink-primary)}
.sv-pje-item:hover{background:var(--pje-panel);border-color:var(--pje-border)}
.sv-pje-item:focus-visible{outline:2px solid var(--pje-focus-ring);outline-offset:-2px}
.sv-pje-item small{display:block;color:var(--pje-ink-secondary);font-size:.7rem}
.sv-pje-panel-foot{margin:.5rem 0 0;padding-top:.5rem;border-top:1px solid var(--pje-border);font-size:.74rem;color:var(--pje-ink-secondary)}

/* --- the source-row drawer (design \xA76.7) ---------------------------------- */
.sv-pje-drawer>summary{cursor:pointer;font-size:.85rem;font-weight:600;padding:.3rem 0}
.sv-pje-drawer>summary:focus-visible{outline:2px solid var(--pje-focus-ring);outline-offset:1px}
.sv-pje-drawer-domain{margin:.5rem 0 .9rem}
.sv-pje-drawer-domain h3{margin:0 0 .3rem;font-family:inherit;font-size:.8rem}
.sv-pje-drawer-scroll{overflow-x:auto}
.sv-pje-drawer table{font-size:.76rem}
.sv-pje-drawer th{cursor:default}
.sv-pje-drawer td{white-space:nowrap;max-width:18rem;overflow:hidden;text-overflow:ellipsis}
.sv-pje-drawer a{color:var(--pje-focus-ring)}
.sv-pje-drawer tbody tr:focus{outline:2px solid var(--pje-focus-ring);outline-offset:-2px}
@media (prefers-reduced-motion:no-preference){.sv-pje-drawer tbody tr.is-flashed{background:#fff3c4;transition:background .2s ease}}

/* --- the persistent live region (design \xA78) -------------------------------- */
.sv-pje-live{position:absolute;width:1px;height:1px;margin:-1px;padding:0;border:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.sv-pje-ai-sentence .sv-pje-ai-chip{margin-right:.15rem}
.sv-pje-ai-cites{display:inline-flex;flex-wrap:wrap;gap:.2rem;vertical-align:middle}
.sv-pje-ai-cite{border:1px solid var(--pje-ai-border);background:var(--pje-surface);color:var(--pje-ai-ink);border-radius:4px;font:inherit;font-size:.68rem;padding:.02rem .35rem;cursor:pointer;max-width:14rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sv-pje-ai-cite:hover{border-color:var(--pje-ai-ink);background:var(--pje-ai-chip)}
.sv-pje-ai-cite.is-off-timeline{border-style:dashed}
.sv-pje-ai-conf{margin-left:.35rem;font-size:.66rem;color:var(--pje-ink-secondary)}
.sv-pje-ai-stale{margin:0 0 .4rem;padding:.3rem .5rem;border-radius:6px;background:var(--pje-surface);border:1px solid var(--pje-warning);color:var(--pje-warning);font-size:.76rem;opacity:1}
.sv-pje-ai-flags{margin:.2rem 0 .3rem;display:flex;flex-wrap:wrap;gap:.25rem}
.sv-pje-ai-flag{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.66rem;padding:.02rem .35rem;border-radius:4px;background:var(--pje-surface);border:1px solid var(--pje-ai-border)}
.sv-pje-ai-actions{display:flex;flex-wrap:wrap;gap:.3rem;margin:.35rem 0 .25rem}
.sv-pje-ai-action.is-accept{border-color:var(--pje-ai-accepted-ink)}
.sv-pje-ai-prov{margin:.2rem 0 0;font-size:.66rem;color:var(--pje-ink-secondary);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.sv-pje-ai-foot{margin:.25rem 0 0;font-size:.7rem;color:var(--pje-ink-secondary)}
.sv-pje-ai-edit-row{display:block;margin:0 0 .4rem}
.sv-pje-ai-textarea{display:block;width:100%;box-sizing:border-box;margin:.15rem 0 0;font:inherit;font-size:.8rem;padding:.3rem .4rem;border:1px solid var(--pje-ai-border);border-radius:6px;background:var(--pje-surface);color:var(--pje-ink-primary)}
.sv-pje-ai-tray{margin:.55rem 0 0}
.sv-pje-ai-tray:empty{display:none}
.sv-pje-ai-tray-head{display:flex;flex-wrap:wrap;align-items:center;gap:.35rem .5rem;margin:0 0 .5rem;padding:.4rem .6rem;border:1px dashed var(--pje-ai-border);border-radius:8px;color:var(--pje-ai-ink);font-size:.78rem}
.sv-pje-ai-tray-hint{color:var(--pje-ink-secondary)}
.sv-pje-ai-request-btn{font-size:.74rem;padding:.15rem .5rem;border-color:var(--pje-ai-border);color:var(--pje-ai-ink)}
.sv-pje-ai-request-btn:hover{border-color:var(--pje-ai-ink);background:var(--pje-ai-chip)}
.sv-pje-narrative-banner:empty{display:none}
.sv-pje-panel-body>.sv-pje-ai{margin-bottom:.8rem}
/* a cited mark, lit from a citation chip (PJE-NARR-011) */
.sv-pje-mark.is-cited{outline:3px solid var(--pje-ai-ink);outline-offset:2px;box-shadow:0 0 0 3px var(--pje-ai-bg),0 0 0 6px var(--pje-ai-border);z-index:3}
@media (prefers-reduced-motion:no-preference){.sv-pje-mark.is-cited{animation:sv-pje-cite-pulse 1.2s ease-out 2}}
@keyframes sv-pje-cite-pulse{0%{box-shadow:0 0 0 3px var(--pje-ai-bg),0 0 0 6px var(--pje-ai-border)}50%{box-shadow:0 0 0 5px var(--pje-ai-bg),0 0 0 10px var(--pje-ai-border)}100%{box-shadow:0 0 0 3px var(--pje-ai-bg),0 0 0 6px var(--pje-ai-border)}}

hing that could re-identify a person.\n6. Count in the units the tools use: study days, elapsed days from the anchor. Report numbers exactly as the rows carry them, with their units.\n7. When the rows are insufficient, contradictory, or the request pushes toward a claim these rules forbid, submit a draft with an empty `sentences` array and a `flags` entry of the form `refused:<reason>` from the refusal catalog. A refusal is a valid answer; an invented sentence is not.\n8. When a recorded value itself contains such wording (a disposition term reading "DUE TO", an outcome), quote it verbatim inside double quotation marks and attribute it to the record; quoted record wording is exempt from rule 3, your own words are not.\n9. Keep to the sentence cap the skill states. Prefer fewer, denser sentences. Plain clinical register; no headings, no bullet lists inside a sentence, no first person.\n10. Set `confidence` per sentence: `high` when the cited rows state the fact directly; `medium` when the sentence combines rows (an offset in days, a count); `low` when a row is partial (an end date not recorded, a blank severity) and you say so.\n\nWhen you have read what you need, submit the draft by calling the `submit_draft` tool exactly once. Do not write the draft as free text.',styleGuide:`# Style guide for patient-journey narratives

Applies to every skill in this folder. The output validator (\`src/patientJourneyNarratives/validator.js\`) loads the forbidden-phrase list from the fenced block at the end of this file, so an edit here changes what is rejected at run time.

## Register

- Plain clinical prose, third person, past tense for what happened, present tense for what the record shows now ("no end date is recorded").
- One claim per sentence where possible. A sentence that combines rows (a count, an offset in days) is fine; a sentence that combines an observation with an interpretation is not.
- Name records the way the rows name them: the preferred term, the con-med name as recorded, the lab test name, the dose with its unit.
- Numbers as the rows carry them. Study days are "day 30", offsets are "12 days before the anchor" or "within 5 days of onset". Never round a lab value; report the ratio to the limit the tool computed.

## Hedging vocabulary (use these)

- "temporally associated with"
- "occurred within N days of"
- "was active at onset" / "was active on day N"
- "started N days after" / "started N days before"
- "consistent with the recorded timeline"
- "is recorded as" / "the record shows"
- "no end date is recorded" / "severity is not recorded"

## Forbidden constructs

- Causal language of any kind: caused, due to, led to, resulted in, because of, secondary to, attributable to, induced, triggered, responsible for.
- Diagnoses the rows do not carry: naming a syndrome, a disease, an injury pattern, or a classification (for example a Hy's-law call) that is not itself a recorded term.
- Treatment recommendations or judgements about care: should, recommend, consider discontinuing, appropriate, inappropriate, off-label, contraindicated.
- Prognosis or risk statements: likely to, at risk of, may develop, prognosis.
- Re-identification: age, sex, occupation, location, dates of birth, anything beyond the participant identifier.
- Confidence beyond the rows: "clearly", "definitely", "certainly", "proves", "confirms".
- Absolutes not supported by a row: "never", "always", "no other".

## Sentence structure

- Every sentence carries at least one citation to a \`row_id\` returned by a tool in this generation. The validator drops sentences whose citations do not all resolve.
- A sentence about a list (the con-meds active at onset) cites every member it names.
- A sentence about a count cites the rows counted, or the anchor when the count came from the context-window tool.
- Do not cite the same row twice in one sentence.

## Quoting the record

A recorded value that itself contains forbidden wording \u2014 a disposition term such as \`PMD DECISION DUE TO AE'S\`, a verbatim outcome \u2014 is quoted verbatim inside double quotation marks and attributed to the record ("the disposition record reads \u2026"). The validator exempts double-quoted spans from the forbidden-phrase block, because the quoted words are the record's claim, not the model's. Never paraphrase such wording into your own sentence, and never quote to smuggle a claim the rows do not carry.

`,refusalCatalog:'# Refusal catalog\n\nA refusal is a valid, schema-conformant draft: `sentences` is empty and `flags` carries exactly one `refused:<reason>` entry from the list below (a skill may add its own descriptive flags after it). The runtime also emits these itself when the validator rejects the model\'s output twice, or when the tools return nothing to describe. The renderer shows a refusal as a card that says why, never as an empty space.\n\n| Flag                        | When to emit it                                                                                                                          | What the card says                                             |\n| --------------------------- | ---------------------------------------------------------------------------------------------------------------------------------------- | -------------------------------------------------------------- |\n| `refused:insufficient-data` | The tools returned no rows for the scope: no events in the window, no lab points for the test, no exposure records, no disposition rows. | "Not enough recorded data to draft a narrative."               |\n| `refused:anchor-not-found`  | The anchor `row_id` does not resolve to an event of this participant.                                                                    | "The anchored event could not be found in the record."         |\n| `refused:ambiguous-scope`   | The request names a test, term or record that matches several rows and no rule picks one.                                                | "The request matched more than one record; narrow it."         |\n| `refused:disallowed-claim`  | The request, or the only sentence the rows support, would require a diagnosis, a causal statement, a treatment judgement or a prognosis. | "A narrative here would need a claim this tool does not make." |\n| `refused:validation`        | Emitted by the runtime: the model\'s output failed the validator twice (schema, citations, forbidden phrases, length).                    | "The draft did not pass validation and was withheld."          |\n| `refused:provider-error`    | Emitted by the runtime: the adapter threw or returned no usable content.                                                                 | "The narrative service did not answer."                        |\n| `refused:reidentification`  | The request asks for anything about the person beyond the identifier the record uses.                                                    | "This tool does not describe the person, only the record."     |\n\nRules:\n\n- A refusal names one reason. Choose the most specific.\n- A refusal never carries prose in `sentences`. If a partial narrative is possible (some facts are supported), draft those sentences and add a descriptive flag such as `partial:labs-missing` instead of refusing.\n- The `provenance` of a refusal is complete: model, skill, input hash, timestamp, tool calls. A refusal is reproducible like any other draft.\n\nRuntime-only additions (never chosen by the model):\n\n| Flag                       | When                                                         | What the card says                             |\n| -------------------------- | ------------------------------------------------------------ | ---------------------------------------------- |\n| `refused:provider-refusal` | The provider declined the request (a `refusal` stop reason). | "The narrative service declined this request." |\n| `refused:cancelled`        | The host cancelled the generation (an AbortSignal).          | Nothing: the card is removed.                  |\n',forbiddenPatterns:["\\bcaus(e|es|ed|ing|al|ation)\\b","\\bdue to\\b","\\bled to\\b","\\bleads? to\\b","\\bresult(s|ed|ing)? (in|from)\\b","\\bbecause of\\b","\\bsecondary to\\b","\\battributable to\\b","\\binduced\\b","\\btriggered\\b","\\bresponsible for\\b","\\bshould\\b","\\brecommend(s|ed|ation)?\\b","\\bconsider (stopping|discontinuing|reducing|withholding)\\b","\\b(in)?appropriate\\b","\\boff-?label\\b","\\bcontraindicat(ed|ion)\\b","\\blikely to\\b","\\bat risk (of|for)\\b","\\bmay develop\\b","\\bprognosis\\b","\\b(clearly|definitely|certainly)\\b","\\bprov(es|ed|en)\\b","\\bconfirm(s|ed)\\b","\\bdiagnos(is|ed|es|tic)\\b","\\bhy'?s law\\b","\\bdrug-induced\\b","\\b(years?|yrs?)[ -]old\\b","\\b(male|female|man|woman)\\b"]},skills:{disposition:{slug:"disposition",version:"1.0.0",modelHint:"claude-opus-5",grounding:"get_events",groundingArgs:["domain=DS"],tools:["get_events","get_subject_overview","get_context_window","get_source_row"],prompt:`## Task

Describe what the record shows around the end of treatment for ONE participant: the disposition event (the record flagged as the reference event) and its day, the other disposition records (milestones), when exposure is recorded as ending, and the last adverse event recorded before the end. Read \`get_subject_overview\` for the exposure extent and the last adverse event. At most four cited sentences.

## What to cover, in this order

1. The disposition event: the decoded term, the verbatim term when it differs, the day (cite the row).
2. The other disposition records, by day (cite them).
3. The exposure extent: first and last exposure day, and whether the last record has an end date (cite the exposure rows the overview names).
4. The last adverse event recorded, its day and whether it is serious (cite it).

## Rules specific to this skill

- A recorded term such as "DISCONTINUED DUE TO ADVERSE EVENT" is the record's own wording: quote it verbatim inside double quotation marks (the validator exempts quoted spans) and do not restate it as your own causal claim. Do not name which adverse event it refers to unless a row says so.
- Never infer the reason for a disposition from the timeline.
- If no row is flagged as the disposition event, say so and describe the milestones.

## Flags you may add

- \`disposition:none\` \u2014 no record is flagged as the disposition event.
- \`sae\` \u2014 the last adverse event is serious.
- \`exposure:end-unrecorded\` \u2014 the last exposure record has no end date.`,schema:{$schema:"https://json-schema.org/draft/2020-12/schema",title:"disposition narrative skill",definitions:{Input:{type:"object",required:["subject"],additionalProperties:!1,properties:{subject:{type:"string",minLength:1}}},Sentence:{type:"object",required:["text","citations","confidence"],additionalProperties:!1,properties:{text:{type:"string",minLength:1,maxLength:400},citations:{type:"array",minItems:1,maxItems:12,items:{type:"string",pattern:"^[A-Z]+[-:][0-9]+$"}},confidence:{type:"string",enum:["high","medium","low"]}}},Draft:{type:"object",required:["kind","subject","summary","sentences","flags"],additionalProperties:!1,properties:{kind:{type:"string",const:"disposition"},subject:{type:"string"},summary:{type:"string",maxLength:240},sentences:{type:"array",maxItems:4,items:{$ref:"#/definitions/Sentence"}},flags:{type:"array",items:{type:"string",maxLength:60}}}},Output:{type:"object",required:["kind","subject","summary","sentences","flags","provenance","status"],properties:{status:{type:"string",const:"draft"},provenance:{$ref:"#/definitions/Provenance"}}},Provenance:{type:"object",required:["model","skill","input_hash","generated_at","tool_calls"],properties:{model:{type:"string"},skill:{type:"string",pattern:"^[a-z-]+@[0-9]+\\.[0-9]+\\.[0-9]+$"},input_hash:{type:"string",pattern:"^sha256:[0-9a-f]{64}$"},generated_at:{type:"string"},tool_calls:{type:"array",items:{type:"string"}}}}}},examples:[{inputs:{subject:"01-716-1447"},reference:{required_facts:["COMPLETED","day 184","PROTOCOL COMPLETED","RANDOMIZED","day 1","FINAL LAB VISIT","CHEST PAIN","day 111"],required_citations:["AE-977","DS-729","DS-730","EX-541"],scope_row_ids:["DS-729","DS-730","DS-731"],expected_flags:[],refusal:null}},{inputs:{subject:"01-701-1023"},reference:{required_facts:["ADVERSE EVENT","day 29","RANDOMIZED","day 1","FINAL LAB VISIT","FINAL RETRIEVAL VISIT","day 198","day 28","ATRIOVENTRICULAR BLOCK SECOND DEGREE","day 22"],required_citations:["AE-6","DS-3","DS-4","EX-3"],scope_row_ids:["DS-3","DS-4","DS-5","DS-6"],expected_flags:[],refusal:null}},{inputs:{subject:"01-701-1211"},reference:{required_facts:["DEATH","day 61","RANDOMIZED","day 1","FINAL LAB VISIT","day 55","day 59","SUDDEN DEATH"],required_citations:["AE-99","DS-67","DS-69","EX-48"],scope_row_ids:["DS-67","DS-68","DS-69"],expected_flags:[],refusal:null}}],readme:'# disposition\n\nWhat the record shows around the end of treatment: the disposition event and its day, the milestones, when exposure ends, and the last adverse event recorded. At most four cited sentences. Use it from the tray beneath the lanes. It quotes a recorded "discontinued due to adverse event" as the record\'s wording and never infers a reason. Inputs: `{ subject }`. Refuses with `refused:insufficient-data` when there are no disposition rows.\n'},"dose-journey":{slug:"dose-journey",version:"1.0.0",modelHint:"claude-opus-5",grounding:"get_dose_history",groundingArgs:[],tools:["get_dose_history","get_events","get_source_row"],prompt:`## Task

Describe ONE participant's exposure and every dose change: the treatment(s), the exposure records and their span, each change (from \u2192 to with unit, its direction, the day the new dose began), and \u2014 read through \`get_events\` for serious events \u2014 any serious adverse event recorded during the study, by day, so the reviewer sees dose changes and serious events on one time line. At most five cited sentences.

## What to cover, in this order

1. Treatment and the exposure span across the records (cite the exposure rows).
2. Each dose change in order, up to three; if more, say how many more and add the flag (cite the change row and its source exposure row).
3. Serious adverse events by day, if any (cite them).
4. Whether the last exposure record has an end date.

## Rules specific to this skill

- A dose change is described by direction as the tool reports it: increase, reduction, interruption (to zero), restart (from zero).
- Do not infer why a dose changed. "Interruption on day 40; a serious event is recorded on day 38" is the strongest juxtaposition allowed \u2014 two facts, in time order, no link asserted.
- A gap between exposure records at the same dose is not a dose change; do not call it one.

## Flags you may add

- \`dose:more-changes\` \u2014 more than three changes; only three are described.
- \`sae\` \u2014 a serious adverse event is recorded.
- \`exposure:end-unrecorded\` \u2014 the last exposure record has no end date.`,schema:{$schema:"https://json-schema.org/draft/2020-12/schema",title:"dose-journey narrative skill",definitions:{Input:{type:"object",required:["subject"],additionalProperties:!1,properties:{subject:{type:"string",minLength:1}}},Sentence:{type:"object",required:["text","citations","confidence"],additionalProperties:!1,properties:{text:{type:"string",minLength:1,maxLength:400},citations:{type:"array",minItems:1,maxItems:12,items:{type:"string",pattern:"^[A-Z]+[-:][0-9]+$"}},confidence:{type:"string",enum:["high","medium","low"]}}},Draft:{type:"object",required:["kind","subject","summary","sentences","flags"],additionalProperties:!1,properties:{kind:{type:"string",const:"dose-journey"},subject:{type:"string"},summary:{type:"string",maxLength:240},sentences:{type:"array",maxItems:5,items:{$ref:"#/definitions/Sentence"}},flags:{type:"array",items:{type:"string",maxLength:60}}}},Output:{type:"object",required:["kind","subject","summary","sentences","flags","provenance","status"],properties:{status:{type:"string",const:"draft"},provenance:{$ref:"#/definitions/Provenance"}}},Provenance:{type:"object",required:["model","skill","input_hash","generated_at","tool_calls"],properties:{model:{type:"string"},skill:{type:"string",pattern:"^[a-z-]+@[0-9]+\\.[0-9]+\\.[0-9]+$"},input_hash:{type:"string",pattern:"^sha256:[0-9a-f]{64}$"},generated_at:{type:"string"},tool_calls:{type:"array",items:{type:"string"}}}}}},examples:[{inputs:{subject:"01-716-1447"},reference:{required_facts:["XANOMELINE","3 record","day 1","day 184","from 54 to 81","day 17","increase","from 81 to 54","day 175","reduction"],required_citations:["DOSE-542","DOSE-543","EX-541","EX-542","EX-543"],scope_row_ids:["DOSE-542","DOSE-543","EX-541","EX-542","EX-543"],expected_flags:[],refusal:null}},{inputs:{subject:"01-701-1034"},reference:{required_facts:["XANOMELINE","3 record","day 1","day 183","from 54 to 0","day 16","interruption"],required_citations:["DOSE-10","EX-9","EX-10","EX-11"],scope_row_ids:["DOSE-10","EX-9","EX-10","EX-11"],expected_flags:[],refusal:null}},{inputs:{subject:"01-701-1148"},reference:{required_facts:["XANOMELINE","3 record","day 1","day 182","from 54 to 81","day 15","increase","from 81 to 0","day 171","interruption"],required_citations:["DOSE-32","DOSE-33","EX-31","EX-32","EX-33"],scope_row_ids:["DOSE-32","DOSE-33","EX-31","EX-32","EX-33"],expected_flags:[],refusal:null}}],readme:"# dose-journey\n\nExposure and every dose change for one participant, with any serious adverse events placed on the same time line by day. At most five cited sentences. Use it from the tray beneath the lanes. Do not use it to explain why a dose changed \u2014 it will not. Inputs: `{ subject }`. Renders as a light-blue card in the tray beneath the lanes, on request. Refuses with `refused:insufficient-data` when there are no exposure records.\n"},"event-context":{slug:"event-context",version:"1.0.0",modelHint:"claude-opus-5",grounding:"get_context_window",groundingArgs:[],tools:["get_context_window","get_lab_series","get_source_row"],prompt:`## Task

Draft the context of ONE anchored event for a safety reviewer: what the record shows was going on around it. The grounding rows are the same lists the reviewer already sees in the context panel \u2014 the con-meds active at the anchor (and those started later in the window), the abnormal labs in the window, the dose changes in the window, and the earlier or same-day events with the same preferred term. Your job is to turn those lists into at most the stated number of sentences a reviewer can read in ten seconds, each one traceable to its rows.

## What to cover, in this order of priority

1. The anchor itself: term, day, severity and seriousness as recorded, whether an end is recorded (cite the anchor row).
2. Con-meds active at onset, named, and the fact when their end is not recorded (cite each con-med row you name). If none, say so in one clause and cite the anchor.
3. Abnormal labs in the window: test, value with unit, the ratio to the limit the tool gives, the day and its offset from the anchor (cite the lab rows). Say which rule fired when the tool says \`change\`.
4. Dose changes in the window: from \u2192 to with unit, direction, day (cite the dose-change row).
5. Earlier same-term events: how many, the most recent one's start and offset (cite them). A same-day record is "recorded on the same day", not a recurrence.
6. Con-meds started later in the window, as a possible response, without asserting intent.

## Rules specific to this skill

- The offset unit is elapsed days from the anchor, as the tool reports them. Do not recompute.
- Do not describe records outside the window except the prior same-term events, which the tool deliberately returns over the whole record.
- If the grounding lists are all empty except the anchor, draft one sentence describing the anchor and add the flag \`context:empty\`.
- Never rank the con-meds by suspicion, never call a con-med hepatotoxic or nephrotoxic, never say a lab change is "consistent with" a drug effect. "Temporally associated" is the strongest link you may draw.
- Do not quote the honesty counters as findings; use them only to hedge ("no end date is recorded").

## Flags you may add

- \`context:empty\` \u2014 nothing in the window beyond the anchor.
- \`sae\` \u2014 the anchor is recorded as serious.
- \`labs:change-rule\` \u2014 at least one abnormal lab fired the change-from-baseline rule.
- \`ends-unrecorded\` \u2014 at least one named con-med has no recorded end.`,schema:{$schema:"https://json-schema.org/draft/2020-12/schema",title:"event-context narrative skill",definitions:{Input:{type:"object",required:["subject","anchor_row_id"],additionalProperties:!1,properties:{subject:{type:"string",minLength:1},anchor_row_id:{type:"string",pattern:"^[A-Z]+[-:][0-9]+$"},window_days:{type:"integer",minimum:0}}},Sentence:{type:"object",required:["text","citations","confidence"],additionalProperties:!1,properties:{text:{type:"string",minLength:1,maxLength:400},citations:{type:"array",minItems:1,maxItems:12,items:{type:"string",pattern:"^[A-Z]+[-:][0-9]+$"}},confidence:{type:"string",enum:["high","medium","low"]}}},Draft:{type:"object",required:["kind","subject","anchor","window_days","summary","sentences","flags"],additionalProperties:!1,properties:{kind:{type:"string",const:"event-context"},subject:{type:"string"},anchor:{type:"object",required:["domain","row_id","term","start_day"],additionalProperties:!1,properties:{domain:{type:"string"},row_id:{type:"string"},term:{type:"string"},start_day:{type:["integer","null"]}}},window_days:{type:"integer",minimum:0},summary:{type:"string",maxLength:240},sentences:{type:"array",maxItems:6,items:{$ref:"#/definitions/Sentence"}},flags:{type:"array",items:{type:"string",maxLength:60}}}},Output:{type:"object",required:["kind","subject","anchor","window_days","summary","sentences","flags","provenance","status"],properties:{status:{type:"string",const:"draft"},provenance:{$ref:"#/definitions/Provenance"}}},Provenance:{type:"object",required:["model","skill","input_hash","generated_at","tool_calls"],properties:{model:{type:"string"},skill:{type:"string",pattern:"^[a-z-]+@[0-9]+\\.[0-9]+\\.[0-9]+$"},input_hash:{type:"string",pattern:"^sha256:[0-9a-f]{64}$"},generated_at:{type:"string"},tool_calls:{type:"array",items:{type:"string"}},adapter:{type:"string"},usage:{type:"object"},dropped:{type:"array"},attempts:{type:"integer"}}}}},examples:[{inputs:{subject:"01-716-1447",anchor_row_id:"AE-973",window_days:30},reference:{required_facts:["ERYTHEMA","day 30","7 con-med","B COMPLEX","MULTIVITAMIN","VITAMIN E","ALEVE","Aspartate Aminotransferase","36 U/L","day 27","1.06","from 54 to 81","day 17","CORTISONE"],required_citations:["AE-973","CM-1005","DOSE-542","LB-6057"],scope_row_ids:["AE-973","AE-974","AE-975","CM-343","CM-344","CM-345","CM-346","CM-1004","CM-1005","CM-1006","CM-1007","CM-1008","DOSE-542","DS-729","EX-541","EX-542","LB-6036","LB-6037","LB-6038","LB-6039","LB-6046","LB-6047","LB-6048","LB-6049","LB-6056","LB-6057","LB-6058","LB-6059","LB-6066","LB-6067","LB-6068","LB-6069"],expected_flags:["ends-unrecorded"],refusal:null}},{inputs:{subject:"01-716-1447",anchor_row_id:"AE-973",window_days:7},reference:{required_facts:["ERYTHEMA","day 30","7 con-med","B COMPLEX","MULTIVITAMIN","VITAMIN E","ALEVE","Aspartate Aminotransferase","36 U/L","day 27","1.06"],required_citations:["AE-973","CM-1005","LB-6057"],scope_row_ids:["AE-973","AE-974","AE-975","CM-343","CM-344","CM-1004","CM-1005","CM-1006","CM-1007","CM-1008","EX-542","LB-6037","LB-6047","LB-6057","LB-6067"],expected_flags:["ends-unrecorded"],refusal:null}},{inputs:{subject:"01-709-1424",anchor_row_id:"AE-632",window_days:30},reference:{required_facts:["SYNCOPE","day 5","3 con-med","MULTIVIT B","VITAMIN C","VITAMIN E"],required_citations:["AE-632","CM-798"],scope_row_ids:["AE-632","CM-797","CM-798","CM-799","CM-800","DS-471","DS-472","DS-473","EX-346","LB-3787","LB-3788","LB-3789","LB-3790","MH-151","MH-1238","MH-1239","MH-1240","MH-1241","MH-1242","MH-1243"],expected_flags:["sae","ends-unrecorded"],refusal:null}}],readme:`# event-context

Drafts the context of one anchored event: the con-meds active at onset, the abnormal labs and dose changes inside the \xB1window, and the earlier events with the same preferred term \u2014 the same four lists the Patient Journey Explorer's context panel prints mechanically, turned into at most six cited sentences.

## Use it when

- A reviewer has anchored an adverse event (or a dose change, or a disposition event) and wants the panel's lists as prose.
- The window is the one the chart shows; the runtime passes \`window_days\` from the live control.

## Do not use it for

- A whole-journey account (that is \`subject-summary\`).
- A single lab test over time (that is \`lab-trajectory\`).
- Anything that would need a relatedness or causality assessment. The skill will not draw one, and the validator rejects the vocabulary.

## Inputs

\`{ subject, anchor_row_id, window_days? }\` \u2014 the anchor id is the chart's own event id (\`AE-7\`); \`AE:7\` is accepted.

## Renders as

A light-blue "AI narrative" card at the top of the context panel body, above "Con-meds active at the anchor". Every sentence carries a \`Draft \u2014 AI generated\` chip and its citation chips; a citation chip lights the cited mark on the timeline.

## Refuses when

- The anchor does not resolve (\`refused:anchor-not-found\`).
- The grounding tool returns nothing at all (\`refused:insufficient-data\`); an anchor with an otherwise empty window is not a refusal \u2014 it drafts one sentence with the \`context:empty\` flag.
`},"lab-trajectory":{slug:"lab-trajectory",version:"1.0.0",modelHint:"claude-opus-5",grounding:"get_lab_series",groundingArgs:[],tools:["get_lab_series","get_events","get_source_row"],prompt:`## Task

Describe ONE lab test's course over the study for one participant: how many measurements, over which days, the baseline the chart uses and its rule, the highest value with its ratio to the limit it crossed and its multiple of baseline, how many values are abnormal and by which rule, and where the last value sits. At most five cited sentences.

## What to cover, in this order

1. The measurement span: count, first and last day, unit, reference range (cite the first and last points).
2. The baseline: value, day, rule (cite the baseline row).
3. The peak: value, day, ratio to the limit, multiple of baseline (cite the peak row).
4. The abnormal count and the rule(s) that fired, naming the flags as recorded (cite the abnormal rows, up to twelve).
5. The last value and whether it is within the reference range (cite it).

## Rules specific to this skill

- Report ratios and multiples as the tool computed them; never recompute or round further.
- "Rose", "fell", "returned toward baseline" describe the numbers; never say a value "normalised" unless the last value is within range and flagged normal.
- Do not name a hepatic, renal or any other injury pattern, and do not compare this test with another test unless the reviewer asked for it in the inputs \u2014 one test per narrative.
- If the series has one point, say so in one sentence and add \`series:single-point\`.

## Flags you may add

- \`labs:change-rule\` \u2014 at least one point fired the change-from-baseline rule.
- \`series:single-point\` \u2014 only one measurement.

Draft the whole-journey summary of ONE participant for a safety reviewer opening their record: what treatment they received and for how long, what adverse events are recorded and which were serious, how the record ends, and anything about the data itself the reviewer must know before reading the lanes. The reviewer sees the first sentence (\`summary\`) as a one-line blurb above the timeline and expands to read the rest.

## What to cover, in this order of priority

1. Exposure: the treatment(s), the exposure extent in study days, the dose range and the number of dose changes. Read \`get_dose_history\` for the exposure rows; cite them.
2. Adverse events: the total, the number of distinct preferred terms, the most frequent terms with counts (cite their rows). Serious events named with their onset day (cite each).
3. The disposition event and its day (cite the disposition row).
4. The last adverse event recorded and its onset day.
5. Data notes the reviewer needs: records with no usable study day, end-before-start records, date conflicts \u2014 state the count, do not speculate why.

## Rules specific to this skill

- The \`summary\` field is one sentence a reviewer reads in three seconds: counts, the span in study days, how the record ends.
- Do not enumerate labs or con-meds beyond their counts unless a serious event makes a specific test relevant; the lab-trajectory skill exists for that.
- Do not characterise the participant's course ("tolerated well", "complicated") \u2014 report what is recorded.
- Never describe the participant beyond the identifier.

## Flags you may add

- \`sae\` \u2014 at least one serious adverse event is recorded.
- \`data:unplaceable\` \u2014 some records have no usable study day.

.sva-app{--bg:#fafaf8;--rail:#f3f4f1;--ink:#1f2328;--soft:#5b6470;--faint:#98a0aa;--accent:#6c3270;--accent-deep:#522456;--accent-soft:rgba(108,50,112,.1);--card:#fff;--rule:#e4e6e3;--line:#cfd3cf;--alarm:#a2423a;

.sva-item:hover,.sva-tab:hover{background:var(--accent-soft)}
.sva-tab[aria-pressed=true],.sva-item[aria-current=page]{background:var(--card);border-color:var(--hue,var(--accent));box-shadow:0 1px 0 var(--rule)}

.sva-button:hover{color:var(--accent);border-color:var(--accent)}
.sva-content{min-width:0}
.sva-chart{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:1rem;min-width:0}
.sva-message{margin:0 0 1rem;max-width:62rem;padding:.9rem 1.1rem;background:var(--card);border:1px solid var(--rule);border-left:3px solid var(--accent);border-radius:10px}

.sva-footer{position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:.4rem 1.5rem;padding:1.15rem var(--gutter) .9rem;border-top:1px solid var(--rule);background:var(--rail);font-family:var(--mono);font-size:.72rem;color:var(--soft)}
.sva-pitch{margin:0}

.sva-map .sva-select{width:100%;min-width:9rem;max-width:26rem}
.sva-map td:last-child{white-space:nowrap}
.sva-map-section td{background:var(--bg);font-family:var(--mono);font-size:.66rem;font-weight:500;letter-spacing:.09em;text-transform:uppercase;color:var(--soft)}
.sva-map-hint td{color:var(--soft);font-size:.86rem}
.sva-map .sva-tag{display:inline-flex;align-items:center;gap:.45em;font-size:.66rem}
.sva-map .sva-tag::before{content:"";flex:none;width:.74em;height:.84em;background:var(--faint);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.sva-map .sva-tag.sva-same::before{background:var(--s2)}
.sva-map .sva-tag.sva-guess::before{background:var(--s1)}
.sva-map .sva-tag.sva-chosen::before{background:var(--accent)}
.sva-map .sva-tag.sva-missing::before{background:var(--s0)}

@media (max-width:900px){
.sva-data{grid-template-columns:minmax(0,1fr);gap:1.1rem}
.sva-side{position:static;max-height:none}
.sva-loaded-file{display:flex;flex-wrap:wrap;gap:.1rem .55rem}
.sva-loaded-file .sva-flags{flex-basis:100%;padding-left:1.25rem}
}
@media (max-width:760px){
.sva-tabs{order:3;flex-basis:100%;min-width:0}
.sva-tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:thin;max-width:100%}
.sva-bar,.sva-charts{min-width:0;max-width:100vw}
.sva-chart{padding:.6rem}
.sva-links{margin-left:0}
}

# An efficacy score summarised by arm and visit, from the ADaM scores table:
# how many participants, the mean and standard deviation of the change from
# baseline, and each arm's mean difference from the reference arm. One row per
# result, in the manner of CDISC's Analysis Results Standard: each value says
# which analysis, which analysis set, which score, which arm and visit, and
# which statistic it is. The last step adds a model: at the last visit, an
# analysis of covariance of the change with baseline as covariate, giving each
# arm's adjusted difference from the reference arm, its standard error, a 95%
# interval and a p-value. The model is fitted by EfficacyModel(), in the R file
# beside this one, since a query cannot fit it.
meta:
  Type: Analysis
  ID: EfficacySummary
  Description: Change from baseline in a score, by arm and visit
  Priority: 2
  File: Analysis_EfficacySummary.csv
  Keys: [PARAM, ARM, VISIT, STATISTIC]
spec:
  ADaM_ADQS:
    USUBJID:
      type: character
    ARM:
      type: character
    VISIT:
      type: character
    VISITNUM:
      type: integer
    TEST:
      type: character
    CHG:
      type: numeric
    BASE:
      type: numeric
    ABLFL:
      type: character
    DY:
      type: integer
steps:
  - output: Temp_Stats
    name: workr::RunQuery
    params:
      df: ADaM_ADQS
      strQuery: "SELECT TEST, ARM, VISIT, CAST(MIN(VISITNUM) AS INTEGER) AS VISITNUM, CAST(COUNT(DISTINCT USUBJID) AS DOUBLE) AS N, AVG(CHG) AS MEAN, STDDEV_SAMP(CHG) AS SD FROM df WHERE ARM IS NOT NULL AND (ABLFL = 'Y' OR DY > 1) GROUP BY TEST, ARM, VISIT"
  - output: Temp_Reference
    name: workr::RunQuery
    params:
      df: Temp_Stats
      strQuery: "SELECT TEST, VISIT, ARM AS REFARM, MEAN AS REFMEAN FROM df WHERE ARM = (SELECT COALESCE(MIN(CASE WHEN lower(ARM) LIKE '%placebo%' OR lower(ARM) LIKE '%control%' THEN ARM END), MIN(ARM)) FROM df)"
  - output: Temp_Both
    name: dplyr::left_join
    params:
      x: Temp_Stats
      'y': Temp_Reference
      by: [TEST, VISIT]
  - output: Temp_Summary
    name: workr::RunQuery
    params:
      df: Temp_Both
      strQuery: "SELECT 'Change from baseline by arm and visit' AS ANALYSIS, 'Enrolled participants with a score at the visit' AS ANALYSISSET, TEST AS PARAM, ARM, VISIT, VISITNUM, STATISTIC, ROUND(VALUE, 2) AS VALUE, REFARM FROM (SELECT TEST, ARM, VISIT, VISITNUM, REFARM, 1 AS ORD, 'n' AS STATISTIC, N AS VALUE FROM df UNION ALL SELECT TEST, ARM, VISIT, VISITNUM, REFARM, 2, 'mean', MEAN FROM df UNION ALL SELECT TEST, ARM, VISIT, VISITNUM, REFARM, 3, 'sd', SD FROM df WHERE SD IS NOT NULL UNION ALL SELECT TEST, ARM, VISIT, VISITNUM, REFARM, 4, 'difference', MEAN - REFMEAN FROM df WHERE REFARM IS NOT NULL AND ARM <> REFARM) ORDER BY PARAM, VISITNUM, ARM, ORD"
  - output: Temp_Model
    name: EfficacyModel
    params:
      df: ADaM_ADQS
  - output: Analysis_EfficacySummary
    name: dplyr::bind_rows
    params:
      x: Temp_Summary
      'y': Temp_Model
columns:
  ANALYSIS:
    label: Analysis
    from: ADQS
    how: "One of two: 'Change from baseline by arm and visit', the summary; and 'Analysis of covariance at the last visit', the model"
  ANALYSISSET:
    label: Analysis Set
    from: ADQS.ARM, ADQS.DY
    how: 'Fixed: an enrolled participant with an arm, at their baseline row or a visit after day one'
  PARAM:
    label: Score
    from: ADQS.TEST
    how: Copied
  ARM:
    label: Description of Planned Arm
    from: ADQS.ARM
    how: Copied
  VISIT:
    label: Visit Name
    from: ADQS.VISIT
    how: Copied
  VISITNUM:
    label: Visit Number
    from: ADQS.VISITNUM
    how: Copied
  STATISTIC:
    label: Statistic
    from: ADQS.CHG
    how: "For the summary: n (participants), mean and sd (of the change from baseline), and difference (the arm's mean less the reference arm's). For the model: adjusted difference, standard error, lower 95% limit, upper 95% limit and p-value"
  VALUE:
    label: Value
    from: ADQS.CHG, ADQS.USUBJID
    how: 'Worked out, to two decimal places; a p-value to four'
  REFARM:
    label: Reference Arm
    from: ADQS.ARM
    how: "Derived: the first arm, by name, that holds 'placebo' or 'control', or the first arm by name when none does"

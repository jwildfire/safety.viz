# NOTICE OF CHANGE. This file is changed from gsm.reporting v1.1.7
# (Gilead Sciences, Apache-2.0), inst/workflow/3_reporting/Results.yaml.
# Changed for study.builder by Jeremy Wildfire, 2026: the last step names
# FilterByLatestSnapshotDate without `gsm.kri::`, since gsm.kri is not
# installed in browser R. These five lines are the only other change.
meta:
  Type: Reporting
  ID: Results
  Description: Reporting Results Data
  Priority: 1
  Active: true
spec:
  Mapped_STUDY:
    GroupID:
      type: character
steps:
  # Capture study ID from the GroupID column in the study metadata.
  - output: GroupID
    name: dplyr::pull
    params:
      .data: Mapped_STUDY
      var: GroupID
  - output: strStudyID
    name: unique
    params:
      x: GroupID
  # Stack all analysis results data into a single data frame.
  - output: Results_Summary
    name: gsm.reporting::BindResults
    params:
      lAnalysis: lAnalyzed
      strName: "Analysis_Summary"
      strStudyID: strStudyID
      dSnapshotDate: dSnapshotDate
  # Stack latest snapshot with previous snapshots.
  - output: Reporting_Results_With_Changes
    name: gsm.reporting::CalculateChange
    params:
      dfResults: Results_Summary
      dfResultsLongitudinal: Reporting_Results_Longitudinal
  # Subset on latest snapshot.
  - output: Reporting_Results
    name: FilterByLatestSnapshotDate
    params:
      df: Reporting_Results_With_Changes


name: Spike - CI speed (temporary)

# TEMPORARY, on the scratch branch spike/ci-speed only. Measures five ways of
# running what ci.yml runs, on the same runner, so the design note can quote
# wall-clock times instead of estimates. Never merge this file.
#
#   v1  one job, the suites run once, the evidence guard reads their results
#   v2  v1 with four browser workers instead of two
#   v3  the eight real-R tests in their own job, the rest in another, a gate
#       job merges the two reports and runs the evidence guard
#   v4  v1 with four workers and tests inside a file run side by side
#   v5  four shards with tests inside a file run side by side, and a gate job

on:
  push:
    branches:
      - spike/ci-speed

permissions:
  contents: read

env:
  REAL_R: 'APP-RBQM-(012|021|030|031|039|047)|APP-R-(032|037)'

jobs:
  # ---------------------------------------------------------------- v1, v2, v4
  single:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: v1 single pass, 2 workers
            id: v1
            args: ''
          - name: v2 single pass, 4 workers
            id: v2
            args: '--workers=4'
          - name: v4 single pass, 4 workers, fully parallel
            id: v4
            args: '--workers=4 --fully-parallel'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Build
        run: npm run build
      - name: Check dist/ matches a fresh build
        run: npm run build:check-dist
      - name: Vendored sources match (six checks)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm run bio-viz:check-source
          npm run statistics:check-source
          npm run r-wasm:check-source
          npm run gsm-workflows:check-source
          npm run gsm-viz:check-source
          npm run rbqm-study:check-source
      - name: Run unit tests
        run: npx vitest run --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/vitest.json"
      - name: Build docs site
        run: npm run site
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run browser tests
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/playwright.json
        run: npx playwright test --project=chromium --reporter=list,json ${{ matrix.args }}
      - name: Evidence freshness guard (from the results above)
        if: always()
        run: node scripts/evidence.mjs --check --vitest-json="$RUNNER_TEMP/vitest.json" --playwright-json="$RUNNER_TEMP/playwright.json"
      - name: Requirement-text sync guard
        run: npm run requirements:check

  # ------------------------------------------------- shared by v3 and v5 gates
  static:
    name: static checks and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Build
        run: npm run build
      - name: Check dist/ matches a fresh build
        run: npm run build:check-dist
      - name: Vendored sources match (six checks)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm run bio-viz:check-source
          npm run statistics:check-source
          npm run r-wasm:check-source
          npm run gsm-workflows:check-source
          npm run gsm-viz:check-source
          npm run rbqm-study:check-source
      - name: Run unit tests
        run: npx vitest run --reporter=default --reporter=json --outputFile=spike-results/vitest.json
      - name: Build docs site
        run: npm run site
      - name: Requirement-text sync guard
        run: npm run requirements:check
      - uses: actions/upload-artifact@v4
        with:
          name: spike-vitest
          path: spike-results/vitest.json
          retention-days: 3

  # ------------------------------------------------------------------------ v3
  v3-browser:
    name: v3 browser, ${{ matrix.part }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: all but real R
            id: rest
            flag: --grep-invert
          - part: real R
            id: real-r
            flag: --grep
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run browser tests
        env:
          PLAYWRIGHT_BLOB_OUTPUT_NAME: ${{ matrix.id }}.zip
          FLAG: ${{ matrix.flag }}
        run: npx playwright test --project=chromium --reporter=list,blob $FLAG "$REAL_R"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spike-v3-blob-${{ matrix.id }}
          path: blob-report/
          retention-days: 3

  v3-gate:
    name: v3 gate (merge and evidence guard)
    runs-on: ubuntu-latest
    needs: [static, v3-browser]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: spike-vitest
          path: spike-results
      - uses: actions/download-artifact@v4
        with:
          pattern: spike-v3-blob-*
          path: spike-blobs
          merge-multiple: true
      - name: Merge the browser reports
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: spike-results/playwright.json
        run: npx playwright merge-reports --reporter=json spike-blobs
      - name: Evidence freshness guard (from the merged results)
        run: node scripts/evidence.mjs --check --vitest-json=spike-results/vitest.json --playwright-json=spike-results/playwright.json

  # ------------------------------------------------------------------------ v5
  v5-browser:
    name: v5 shard ${{ matrix.shard }} of 4
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run browser tests
        run: npx playwright test --project=chromium --reporter=list,blob --fully-parallel --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spike-v5-blob-${{ matrix.shard }}
          path: blob-report/
          retention-days: 3

  v5-gate:
    name: v5 gate (merge and evidence guard)
    runs-on: ubuntu-latest
    needs: [static, v5-browser]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: spike-vitest
          path: spike-results
      - uses: actions/download-artifact@v4
        with:
          pattern: spike-v5-blob-*
          path: spike-blobs
          merge-multiple: true
      - name: Merge the browser reports
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: spike-results/playwright.json
        run: npx playwright merge-reports --reporter=json spike-blobs
      - name: Evidence freshness guard (from the merged results)
        run: node scripts/evidence.mjs --check --vitest-json=spike-results/vitest.json --playwright-json=spike-results/playwright.json

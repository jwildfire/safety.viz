name: Spike - CI speed (temporary)

# TEMPORARY, on the scratch branch spike/ci-speed only. Measures ways of running
# what ci.yml runs, on the same runner, so the design note can quote wall-clock
# times instead of estimates. Never merge this file.
#
# Round 2: each layout runs twice in the same run (rep a and b), for spread.
#
#   v1  one job, the suites run once, the evidence guard reads their results
#   v3  the eight real-R tests in their own job, the rest in another, static
#       checks and unit tests in a third, and a gate job that merges the two
#       browser reports and runs the evidence guard
#   v6  v3's larger browser job with the browser installed without its system
#       packages, to see whether the screenshots still match
#
# Round 1 (commit 1fa7f0df, run 37941542874) also ran four workers (v2), tests
# inside a file side by side (v4) and four shards (v5).

on:
  push:
    branches:
      - spike/ci-speed

permissions:
  contents: read

env:
  REAL_R: 'APP-RBQM-(012|021|030|031|039|047)|APP-R-(032|037)'

jobs:
  v1:
    name: v1 single pass (${{ matrix.rep }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rep: [a, b]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Build
        run: npm run build
      - name: Check dist/ matches a fresh build
        run: npm run build:check-dist
      - name: Vendored sources match (six checks)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm run bio-viz:check-source
          npm run statistics:check-source
          npm run r-wasm:check-source
          npm run gsm-workflows:check-source
          npm run gsm-viz:check-source
          npm run rbqm-study:check-source
      - name: Run unit tests
        run: npx vitest run --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/vitest.json"
      - name: Build docs site
        run: npm run site
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run browser tests
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/playwright.json
        run: npx playwright test --project=chromium --reporter=list,json
      - name: Evidence freshness guard (from the results above)
        if: always()
        run: node scripts/evidence.mjs --check --vitest-json="$RUNNER_TEMP/vitest.json" --playwright-json="$RUNNER_TEMP/playwright.json"
      - name: Requirement-text sync guard
        run: npm run requirements:check

  v3-static:
    name: v3 static checks and unit tests (${{ matrix.rep }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rep: [a, b]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Build
        run: npm run build
      - name: Check dist/ matches a fresh build
        run: npm run build:check-dist
      - name: Vendored sources match (six checks)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm run bio-viz:check-source
          npm run statistics:check-source
          npm run r-wasm:check-source
          npm run gsm-workflows:check-source
          npm run gsm-viz:check-source
          npm run rbqm-study:check-source
      - name: Run unit tests
        run: npx vitest run --reporter=default --reporter=json --outputFile=spike-results/vitest.json
      - name: Build docs site
        run: npm run site
      - name: Requirement-text sync guard
        run: npm run requirements:check
      - uses: actions/upload-artifact@v4
        with:
          name: spike-vitest-${{ matrix.rep }}
          path: spike-results/vitest.json
          retention-days: 3

  v3-browser:
    name: v3 browser, ${{ matrix.part }} (${{ matrix.rep }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rep: [a, b]
        id: [rest, real-r]
        include:
          - id: rest
            part: all but real R
            flag: --grep-invert
          - id: real-r
            part: real R
            flag: --grep
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run browser tests
        env:
          PLAYWRIGHT_BLOB_OUTPUT_NAME: ${{ matrix.id }}.zip
          FLAG: ${{ matrix.flag }}
        run: npx playwright test --project=chromium --reporter=list,blob $FLAG "$REAL_R"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spike-v3-blob-${{ matrix.rep }}-${{ matrix.id }}
          path: blob-report/
          retention-days: 3

  v3-gate:
    name: v3 gate (${{ matrix.rep }})
    runs-on: ubuntu-latest
    needs: [v3-static, v3-browser]
    if: always()
    strategy:
      fail-fast: false
      matrix:
        rep: [a, b]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: spike-vitest-${{ matrix.rep }}
          path: spike-results
      - uses: actions/download-artifact@v4
        with:
          pattern: spike-v3-blob-${{ matrix.rep }}-*
          path: spike-blobs
          merge-multiple: true
      - name: Merge the browser reports
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: spike-results/playwright.json
        run: npx playwright merge-reports --reporter=json spike-blobs
      - name: Evidence freshness guard (from the merged results)
        run: node scripts/evidence.mjs --check --vitest-json=spike-results/vitest.json --playwright-json=spike-results/playwright.json

  v6:
    name: v6 browser without system packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install Playwright browsers (no system packages)
        run: npx playwright install chromium
      - name: Run browser tests
        run: npx playwright test --project=chromium --reporter=list --grep-invert "$REAL_R"

# gsm's raw adverse events table, made from the demo app's standard Adverse
# events domain (#253, obot.roadmap#398).
#
# A row is an event when its preferred term is not blank: the placeholder rows
# that stand for participants with no events are left out, by the rule the
# app's own charts follow. What the standard domain does not hold in gsm's
# form (dates, toxicity grade, relatedness) is left empty. Seriousness is read
# trimmed and in capitals, as the end-of-study status is: gsm counts an event
# as serious when it reads Y.
meta:
  Type: Raw
  ID: AE
  Description: Raw adverse events table from the standard Adverse events domain
  Priority: 1
spec:
  Standard_ae:
    USUBJID:
      type: character
    AEDECOD:
      type: character
    AESER:
      type: character
steps:
  - output: Raw_AE
    name: workr::RunQuery
    params:
      df: Standard_ae
      strQuery: "SELECT 'STUDY' AS studyid, USUBJID AS subjid, NULLIF(UPPER(TRIM(AESER)), '') AS aeser, CAST(NULL AS DATE) AS aest_dt, CAST(NULL AS DATE) AS aeen_dt, AEDECOD AS mdrpt_nsv, CAST(NULL AS VARCHAR) AS mdrsoc_nsv, CAST(NULL AS INTEGER) AS aetoxgr, CAST(NULL AS VARCHAR) AS aeongo, CAST(NULL AS VARCHAR) AS aerel, CAST(NULL AS TIMESTAMP) AS mincreated_dts FROM df WHERE NULLIF(TRIM(AEDECOD), '') IS NOT NULL"

# gsm's raw site table, made from the demo app's standard Subject-level domain
# (#253, obot.roadmap#398): one row for each site a participant is at. The
# standard domain holds nothing else of a site, so the investigator, place and
# status are left empty. With it gsm's Groups table can be made, which counts
# each site's participants.
meta:
  Type: Raw
  ID: SITE
  Description: Raw site table from the standard Subject-level domain
  Priority: 1
spec:
  Standard_subject:
    SITEID:
      type: character
steps:
  - output: Raw_SITE
    name: workr::RunQuery
    params:
      df: Standard_subject
      strQuery: "SELECT DISTINCT 'STUDY' AS studyid, TRIM(SITEID) AS invid, CAST(NULL AS VARCHAR) AS InvestigatorFirstName, CAST(NULL AS VARCHAR) AS InvestigatorLastName, CAST(NULL AS VARCHAR) AS site_status, CAST(NULL AS VARCHAR) AS City, CAST(NULL AS VARCHAR) AS State, CAST(NULL AS VARCHAR) AS Country, CAST(NULL AS DATE) AS site_active_dt FROM df WHERE NULLIF(TRIM(SITEID), '') IS NOT NULL ORDER BY invid"

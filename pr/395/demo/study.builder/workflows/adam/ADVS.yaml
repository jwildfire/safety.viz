# ADaM vital signs table, from the raw vital signs table and ADSL. One row per
# participant, visit and vital sign that was taken.
meta:
  Type: ADaM
  ID: ADVS
  Description: Vital signs analysis table
  Priority: 2
  File: advs.csv
  Keys: [USUBJID, VISIT, TEST]
  Domain: bds
spec:
  Raw_VS:
    subjid:
      type: character
    visit:
      type: character
    vs_dt:
      type: Date
    weight:
      type: numeric
    height:
      type: numeric
    bsa:
      type: numeric
    sysbp:
      type: numeric
    diabp:
      type: numeric
    pulse:
      type: numeric
    temp:
      type: numeric
    resp:
      type: numeric
  ADaM_ADSL:
    USUBJID:
      type: character
    SITEID:
      type: character
    SEX:
      type: character
    RACE:
      type: character
    TRTSDT:
      type: Date
steps:
  - output: Temp_Subject
    name: workr::RunQuery
    params:
      df: ADaM_ADSL
      strQuery: 'SELECT USUBJID AS subjid, SITEID, SEX, RACE, TRTSDT FROM df'
  - output: Temp_VisitOrder
    name: workr::RunQuery
    params:
      df: Raw_VS
      strQuery: 'SELECT visit, CAST(ROW_NUMBER() OVER (ORDER BY MIN(vs_dt)) - 1 AS INTEGER) AS VISITNUM FROM df GROUP BY visit'
  - output: Temp_VS
    name: dplyr::left_join
    params:
      x: Raw_VS
      'y': Temp_Subject
      by: subjid
  - output: Temp_VSOrdered
    name: dplyr::left_join
    params:
      x: Temp_VS
      'y': Temp_VisitOrder
      by: visit
  - output: ADaM_ADVS
    name: workr::RunQuery
    params:
      df: Temp_VSOrdered
      strQuery: "SELECT subjid AS USUBJID, 'All participants' AS ARM, SITEID, SEX, RACE, visit AS VISIT, VISITNUM, CASE vital WHEN 'weight' THEN 'Weight' WHEN 'height' THEN 'Height' WHEN 'bsa' THEN 'Body surface area' WHEN 'sysbp' THEN 'Systolic blood pressure' WHEN 'diabp' THEN 'Diastolic blood pressure' WHEN 'pulse' THEN 'Pulse' WHEN 'temp' THEN 'Temperature' ELSE 'Respiratory rate' END AS TEST, CASE vital WHEN 'weight' THEN 'kg' WHEN 'height' THEN 'cm' WHEN 'bsa' THEN 'm2' WHEN 'sysbp' THEN 'mmHg' WHEN 'diabp' THEN 'mmHg' WHEN 'pulse' THEN 'beats/min' WHEN 'temp' THEN 'C' ELSE 'breaths/min' END AS STRESU, STRESN, CAST(CASE WHEN vs_dt >= TRTSDT THEN date_diff('day', TRTSDT, CAST(vs_dt AS DATE)) + 1 ELSE date_diff('day', TRTSDT, CAST(vs_dt AS DATE)) END AS INTEGER) AS DY FROM (UNPIVOT (SELECT subjid, SITEID, SEX, RACE, visit, VISITNUM, vs_dt, TRTSDT, CAST(weight AS DOUBLE) AS weight, CAST(height AS DOUBLE) AS height, CAST(bsa AS DOUBLE) AS bsa, CAST(sysbp AS DOUBLE) AS sysbp, CAST(diabp AS DOUBLE) AS diabp, CAST(pulse AS DOUBLE) AS pulse, CAST(temp AS DOUBLE) AS temp, CAST(resp AS DOUBLE) AS resp FROM df) ON weight, height, bsa, sysbp, diabp, pulse, temp, resp INTO NAME vital VALUE STRESN) ORDER BY TEST, USUBJID, VISITNUM"
columns:
  USUBJID:
    label: Unique Subject Identifier
    from: Raw_VS.subjid
    how: Copied
  ARM:
    label: Description of Planned Arm
    from: ''
    how: "A label of study.builder's: gsm.datasim makes no treatment arms"
  SITEID:
    label: Study Site Identifier
    from: ADSL.SITEID
    how: Joined from the participant's row
  SEX:
    label: Sex
    from: ADSL.SEX
    how: Joined from the participant's row
  RACE:
    label: Race
    from: ADSL.RACE
    how: Joined from the participant's row
  VISIT:
    label: Visit Name
    from: Raw_VS.visit
    how: Copied
  VISITNUM:
    label: Visit Number
    from: Raw_VS.vs_dt
    how: "Derived: the visit's place in the order of first visit dates across the study"
  TEST:
    label: Test Name
    from: 'Raw_VS: weight, height, bsa, sysbp, diabp, pulse, temp, resp'
    how: 'Reshaped: one row for each vital sign that was taken'
  STRESU:
    label: Standard Units
    from: ''
    how: The unit gsm.datasim's own averages are in; its generator states none
  STRESN:
    label: Numeric Result in Standard Units
    from: 'Raw_VS: weight, height, bsa, sysbp, diabp, pulse, temp, resp'
    how: 'Reshaped: one row for each vital sign that was taken'
  DY:
    label: Study Day
    from: Raw_VS.vs_dt, ADSL.TRTSDT
    how: 'Derived: the date less day one, plus one; a day before day one counts back from -1'

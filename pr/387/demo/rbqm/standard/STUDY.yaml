# gsm's raw study table, made from the demo app's standard Subject-level
# domain (#253, obot.roadmap#398): one row, the study. The standard domains
# name no study and hold no plan for it, so its ID is the word STUDY and every
# other column is left empty.
meta:
  Type: Raw
  ID: STUDY
  Description: Raw study table from the standard Subject-level domain
  Priority: 1
spec:
  Standard_subject:
    USUBJID:
      type: character
steps:
  - output: Raw_STUDY
    name: workr::RunQuery
    params:
      df: Standard_subject
      strQuery: "SELECT DISTINCT 'STUDY' AS studyid, CAST(NULL AS VARCHAR) AS nickname, CAST(NULL AS VARCHAR) AS protocol_title, CAST(NULL AS VARCHAR) AS status, CAST(NULL AS INTEGER) AS num_plan_site, CAST(NULL AS INTEGER) AS num_plan_subj, CAST(NULL AS DATE) AS act_fpfv, CAST(NULL AS DATE) AS est_fpfv, CAST(NULL AS DATE) AS est_lplv, CAST(NULL AS DATE) AS est_lpfv, CAST(NULL AS DATE) AS db_lock_dt, CAST(NULL AS VARCHAR) AS therapeutic_area, CAST(NULL AS VARCHAR) AS protocol_indication, CAST(NULL AS VARCHAR) AS phase, CAST(NULL AS VARCHAR) AS product FROM df"

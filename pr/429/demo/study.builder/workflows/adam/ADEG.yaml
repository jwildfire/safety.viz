# ADaM ECG table, from the raw ECG table, the raw visits table and ADSL. One
# row per enrolled participant, visit and ECG measure. Baseline is the
# participant's last ECG on or before day one, or their first ECG when none is.
meta:
  Type: ADaM
  ID: ADEG
  Description: ECG analysis table
  Priority: 2
  File: adeg.csv
  Keys: [USUBJID, VISIT, TEST]
  Domain: eg
spec:
  Raw_EG:
    subjid:
      type: character
    visnam:
      type: character
    eg_dt:
      type: Date
    egtstnam:
      type: character
    egresn:
      type: numeric
    egresu:
      type: character
  Raw_VISIT:
    visit:
      type: character
    visit_dt:
      type: Date
  ADaM_ADSL:
    USUBJID:
      type: character
    ARM:
      type: character
    TRTSDT:
      type: Date
steps:
  - output: Temp_Subject
    name: workr::RunQuery
    params:
      df: ADaM_ADSL
      strQuery: 'SELECT USUBJID AS subjid, ARM, TRTSDT FROM df'
  - output: Temp_VisitOrder
    name: workr::RunQuery
    params:
      df: Raw_VISIT
      strQuery: 'SELECT visit AS visnam, CAST(ROW_NUMBER() OVER (ORDER BY MIN(visit_dt), visit) - 1 AS INTEGER) AS VISITNUM FROM df GROUP BY visit'
  - output: Temp_EG
    name: dplyr::inner_join
    params:
      x: Raw_EG
      'y': Temp_Subject
      by: subjid
  - output: Temp_EGOrdered
    name: dplyr::left_join
    params:
      x: Temp_EG
      'y': Temp_VisitOrder
      by: visnam
  - output: Temp_EGDay
    name: workr::RunQuery
    params:
      df: Temp_EGOrdered
      strQuery: "SELECT subjid, ARM, visnam, VISITNUM, CASE egtstnam WHEN 'QTcF Interval, Aggregate' THEN 'QTcF' WHEN 'QTcB Interval, Aggregate' THEN 'QTcB' WHEN 'ECG Mean Heart Rate' THEN 'Heart Rate' ELSE egtstnam END AS TEST, CAST(egresn AS DOUBLE) AS STRESN, egresu AS STRESU, CAST(CASE WHEN CAST(eg_dt AS DATE) >= TRTSDT THEN date_diff('day', TRTSDT, CAST(eg_dt AS DATE)) + 1 ELSE date_diff('day', TRTSDT, CAST(eg_dt AS DATE)) END AS INTEGER) AS DY FROM df"
  - output: Temp_EGBase
    name: workr::RunQuery
    params:
      df: Temp_EGDay
      strQuery: 'SELECT subjid, TEST, arg_min(visnam, CASE WHEN DY <= 1 THEN -1000000 - DY ELSE DY END) AS base_visit, arg_min(STRESN, CASE WHEN DY <= 1 THEN -1000000 - DY ELSE DY END) AS BASE FROM df GROUP BY subjid, TEST'
  - output: Temp_EGWithBase
    name: dplyr::left_join
    params:
      x: Temp_EGDay
      'y': Temp_EGBase
      by: [subjid, TEST]
  - output: ADaM_ADEG
    name: workr::RunQuery
    params:
      df: Temp_EGWithBase
      strQuery: "SELECT subjid AS USUBJID, ARM, visnam AS VISIT, VISITNUM, TEST, STRESU, STRESN, BASE, STRESN - BASE AS CHG, CASE WHEN visnam = base_visit THEN 'Y' ELSE '' END AS ABLFL, DY FROM df ORDER BY TEST, USUBJID, VISITNUM"
columns:
  USUBJID:
    label: Unique Subject Identifier
    from: Raw_EG.subjid
    how: Copied, for an enrolled participant
  ARM:
    label: Description of Planned Arm
    from: ADSL.ARM
    how: Joined from the participant's row
  VISIT:
    label: Visit Name
    from: Raw_EG.visnam
    how: Copied
  VISITNUM:
    label: Visit Number
    from: Raw_VISIT.visit_dt
    how: "Derived: the visit's place in the order of first visit dates across the study"
  TEST:
    label: Test Name
    from: Raw_EG.egtstnam
    how: "Shortened: 'QTcF Interval, Aggregate' is QTcF, 'QTcB Interval, Aggregate' is QTcB and 'ECG Mean Heart Rate' is Heart Rate"
  STRESU:
    label: Standard Units
    from: Raw_EG.egresu
    how: Copied
  STRESN:
    label: Numeric Result in Standard Units
    from: Raw_EG.egresn
    how: Copied
  BASE:
    label: Baseline Value
    from: Raw_EG.egresn
    how: "Derived: the participant's last result of the measure on or before day one, or their first when none is"
  CHG:
    label: Change from Baseline
    from: Raw_EG.egresn
    how: 'Derived: the result less the baseline'
  ABLFL:
    label: Baseline Record Flag
    from: Raw_EG.eg_dt
    how: 'Derived: Y on the row the baseline was taken from'
  DY:
    label: Study Day
    from: Raw_EG.eg_dt, ADSL.TRTSDT
    how: 'Derived: the date less day one, plus one; a day before day one counts back from -1'

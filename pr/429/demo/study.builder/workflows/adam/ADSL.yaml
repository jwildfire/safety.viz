# ADaM subject-level table, from the raw participants table. One row per
# enrolled participant: a participant who was screened and not enrolled has no
# arm and no day one, and is in no ADaM table. TRTSDT is each participant's day one, which the other ADaM
# tables count study days from.
meta:
  Type: ADaM
  ID: ADSL
  Description: Subject-level analysis table
  Priority: 1
  File: adsl.csv
  Keys: [USUBJID]
  Domain: subject
spec:
  Raw_SUBJ:
    subjid:
      type: character
    invid:
      type: character
    enrollyn:
      type: character
    arm:
      type: character
    sex:
      type: character
    race:
      type: character
    timeonstudy:
      type: integer
    firstdosedate:
      type: Date
    enrolldt:
      type: Date
steps:
  - output: ADaM_ADSL
    name: workr::RunQuery
    params:
      df: Raw_SUBJ
      strQuery: "SELECT subjid AS USUBJID, arm AS ARM, invid AS SITEID, sex AS SEX, race AS RACE, CAST(timeonstudy AS INTEGER) AS EOSDY, COALESCE(CAST(firstdosedate AS DATE), CAST(enrolldt AS DATE)) AS TRTSDT FROM df WHERE enrollyn = 'Y' ORDER BY subjid"
# Where each column came from. study.builder reads this block; workr does not.
columns:
  USUBJID:
    label: Unique Subject Identifier
    from: Raw_SUBJ.subjid
    how: 'Copied, for a participant who was enrolled (Raw_SUBJ.enrollyn is Y)'
  ARM:
    label: Description of Planned Arm
    from: Raw_SUBJ.arm
    how: Copied
  SITEID:
    label: Study Site Identifier
    from: Raw_SUBJ.invid
    how: Copied
  SEX:
    label: Sex
    from: Raw_SUBJ.sex
    how: Copied
  RACE:
    label: Race
    from: Raw_SUBJ.race
    how: Copied
  EOSDY:
    label: End of Study Relative Day
    from: Raw_SUBJ.timeonstudy
    how: Copied
  TRTSDT:
    label: Date of First Exposure to Treatment
    from: Raw_SUBJ.firstdosedate, Raw_SUBJ.enrolldt
    how: 'Derived: the first dose date, or the enrolment date for a participant with no dose'
